}
function undo(){
  const last = S.history[S.history.length - 1]; if (!last) { if (!isLegacy() && curQ() && S.questionAwards[curQ().id]) return reopenCurrentAward(); return; }
  const g = last.g; const popped = [];
  while (S.history.length){
    const h = S.history[S.history.length - 1];
    if (g ? h.g === g : popped.length === 0) popped.push(S.history.pop()); else break;
  }
  popped.forEach(h => { const t = team(h.id); if (t) t.score -= h.d; });
  if (g && S.buzz.g === g){ S.buzz.awarded = false; S.buzz.g = null; }
  if (g && S.questionAwards) Object.keys(S.questionAwards).forEach(qid => { if (S.questionAwards[qid].g === g) delete S.questionAwards[qid]; });
  if (g) Object.keys(S.scored).forEach(k => { if (S.scored[k] === g) delete S.scored[k]; });
  commit();
  toast('Undone: ' + popped.map(h => `${h.d > 0 ? '+' : ''}${h.d} ${teamName(h.id)}`).join(', '));
}

/* ---------- Game flow ---------- */
function questionPhase(){
  return PQPLifecycle.phase({ open: S.buzz.open, revealed: S.revealed,
    awarded: S.buzz.awarded, order: S.buzz.order, started: !!curQ() });
}
function rememberQuestion(){
  const q = curQ(); if (!q || isLegacy() || !inPlay()) return;
  S.questionSessions[q.id] = {
    revealed: !!S.revealed, open: !!S.buzz.open, awarded: !!S.buzz.awarded,
    order: S.buzz.order.map(b => ({ id:b.id, t:b.t, st:b.st, ans:b.ans, hits:b.hits })),
    closedAt: +S.buzz.closedAt || 0, g: S.buzz.g || null
  };
}
function restoreQuestion(){
  const q = curQ(), stored = q && S.questionSessions[q.id];
  if (!isLegacy() && stored){
    const ids = new Set(S.teams.map(t => t.id));
    const b = PQPLifecycle.cleanSession(stored, ids);
    S.revealed = b.revealed;
    S.recap = false; S.avatarFx = {};
    const storedOrder = isShowExclusive() ? PQPShowBuzzer.oneActive(b.order) : b.order;
    S.buzz = { open: b.open && !b.revealed && !S.questionAwards[q.id] && !(isShowExclusive() && PQPShowBuzzer.active({order:storedOrder})), order: storedOrder,
      awarded: !!S.questionAwards[q.id], g: S.questionAwards[q.id]?.g || null,
      n: uid(), closedAt: 0 };
    /* Old phone messages must not be counted after question navigation. */
    if (S.buzz.awarded){ S.buzz.open = false; S.revealed = true; }
    timerReset();
    return;
  }
  resetForQuestion(true);
  if (!isLegacy() && q && S.questionAwards[q.id]){
    S.buzz.awarded = true; S.buzz.open = false; S.buzz.g = S.questionAwards[q.id].g;
    S.revealed = true;
  }
}
function commit(){ save(); render(); }
function resetForQuestion(open){
  S.revealed = false;
  S.recap = false;
  S.avatarFx = {};
  S.buzz = { open: !!open && S.settings.autoOpen, order: [], awarded: false, g: null, n: uid(), closedAt: 0 };
  timerReset();
  if (open && S.settings.autoTimer) timerStart();
}
function restartGame(){
  S.teams.forEach(t => { t.score = 0; });
  S.history = [];
  S.finished = false; S.between = false; S.showBoard = false;
  S.lobby = true; S.ready = []; S.seen = []; S.scored = {}; S.questionAwards = {}; S.questionSessions = {};
  S.lx = { rid: '', clue: false, mystery: false };
  S.tb = { on: false, i: 0, guesses: {}, shown: false, winner: null };
  const r = nextNonEmpty(0);
  S.pos = { r: r < 0 ? 0 : r, q: 0 };
  resetForQuestion(true);
}
function startQuiz(){
  if (!totalQs()){ toast('Add some questions first.'); setView('setup'); return; }
  if (!S.teams.length){ toast(`Add at least one ${noun()} first.`); setView('setup'); return; }
  S.lobby = false; S.finished = false; S.between = false; S.showBoard = false;
  const r = nextNonEmpty(0);
  S.pos = { r: r < 0 ? 0 : r, q: 0 };
  resetForQuestion(true);
  save();
  setView('host');
  playCue('go', .38);
  toast('Quiz started. Good luck!');
}
function finish(){
  if (inPlay()) rememberQuestion();
  S.finished = true; S.between = false; S.showBoard = true;
  resetForQuestion(false);
  commit(); fanfare();
  toast('That\u2019s the quiz! Final scores are on the player screen.');
}
function goNext(){
  if (!totalQs() || S.finished) return;
  if (!isLegacy() && inPlay() && !isWritten() && !S.buzz.awarded){
    toast('Finalise this question before continuing: reveal, mark and award, or use Skip for zero points.'); return;
  }
  if (S.lobby){ startQuiz(); return; }
  const R = rounds();
  if (inPlay()) rememberQuestion();
  let note = '';
  if (inPlay() && isLegacy() && (isSpeed() || isAnswerRound()) && !S.buzz.awarded){ if (isAnswerRound() && !S.revealed) autoMark(); if (awardSpeed(true)) note = 'Points awarded for that question.'; }
  if (S.between){
    const nr = nextNonEmpty(S.pos.r + 1);
    S.between = false; S.showBoard = false;
    if (nr < 0){ finish(); return; }
    S.pos = { r: nr, q: 0 };
    restoreQuestion(); commit();
    toast(`${R[nr].name} starts now`);
    return;
  }
  if (!isLastInRound()){
    S.pos.q += 1; S.showBoard = false;
    restoreQuestion(); commit();
    if (note) toast(note);
    return;
  }
  /* A written round pauses at its end so answers can be read out and sheets marked */
  if (isLastRound() && curRound().mode !== 'written'){ finish(); return; }
  S.between = true; S.showBoard = true;
  resetForQuestion(false); commit();
  toast(curRound().mode === 'written' ? `End of ${R[S.pos.r].name}. Read the answers, then enter the scores.` : `End of ${R[S.pos.r].name}. Leaderboard is up.`);
}
function goPrev(){
  if (!totalQs() || S.lobby) return;
  if (S.finished || S.between){
    S.finished = false; S.between = false; S.showBoard = false;
    restoreQuestion(); commit();
    return;
  }
  if (inPlay()) rememberQuestion();
  if (S.pos.q > 0) S.pos.q -= 1;
  else {
    const pr = prevNonEmpty(S.pos.r - 1);
    if (pr < 0) return;
    S.pos = { r: pr, q: rounds()[pr].questions.length - 1 };
  }
  S.showBoard = false;
  restoreQuestion(); commit();
}
function goNextRound(){
  if (S.lobby) return;
  if (!isLegacy() && inPlay() && !isWritten() && !S.buzz.awarded){
    toast('Finalise this question before advancing to the next round.'); return;
  }
  const nr = nextNonEmpty(S.pos.r + 1);
  if (nr < 0){ toast('This is the last round.'); return; }
  if (inPlay() && isLegacy() && (isSpeed() || isAnswerRound()) && !S.buzz.awarded){ if (isAnswerRound() && !S.revealed) autoMark(); awardSpeed(true); }
  if (inPlay()) rememberQuestion();
  S.between = false; S.finished = false; S.showBoard = false;
  S.pos = { r: nr, q: 0 };
  restoreQuestion(); commit();
  toast(`${rounds()[nr].name} starts now`);
}
function toggleReveal(){
  if (!inPlay() || !curQ()) return;
  if (isShowExclusive() && showActive() && !S.buzz.awarded){
    toast('Judge the active buzzer before revealing.'); return;
  }
  if (!isLegacy() && S.revealed) { toast('The answer has already been revealed.'); return; }
  S.revealed = !S.revealed;
  if (S.revealed && !S.seen.includes(curQ().id)) S.seen.push(curQ().id);
  if (S.revealed){ if (S.buzz.open) S.buzz.closedAt = Date.now(); S.buzz.open = false; timerPause(); }
  let note = '';
  if (S.revealed && isAnswerRound() && !S.buzz.awarded){
    autoMark();
    if (isChoice() && isLegacy()){
      const gains = Array.from(speedAwards()).filter(([, p]) => p > 0);
      if (awardSpeed(true)) note = gains.map(([id, p]) => `${teamName(id)} +${p}`).join(', ');
      else note = S.buzz.order.length ? 'Nobody got it right.' : 'Nobody answered.';
    }
  }
  commit();
  if (S.revealed) playCue(note ? 'gain' : 'correct', .25);
  if (note) toast(note);
}
function buzz(id, te, ans){
  const t = team(id); if (!t) return;
  if (!totalQs()) return;
  const remote = te !== undefined;
  const done = () => { if (remote){ save(); softRender(); } else commit(); };
  if (S.lobby){
    if (!S.ready.includes(id)){
      S.ready.push(id);
      playCue('join', .25);
      done();
      toast(`${t.name} is ready`);
    } else if (!remote) beep(600, 0.08);
    return;
  }
  if (isWritten()){ if (!remote) toast('This round uses written answers, so buzzers are off.'); return; }
  if (isAnswerRound()){
    if (ans === undefined || ans === null || ans === ''){ if (!remote) toast(isChoice() ? `Tap A, B, C or D in your ${noun()}\u2019s row.` : 'In this round answers are typed on phones.'); return; }
    if (isChoice()){ ans = Number(ans); if (!(ans >= 0 && ans <= 3)) return; }
    else ans = String(ans).replace(/\s+/g, ' ').trim().slice(0, 160);
    if (ans === '') return;
  }
  const now = Date.now();
  const at = !isLegacy() ? now : Number.isFinite(te) && te >= now - 2500 && te <= now + 200 ? Math.min(te, now) : now;
  if (S.between || S.finished){ if (!remote) toast('No question is live right now.'); return; }
  if (S.buzz.awarded || (!isLegacy() && curQ() && S.questionAwards[curQ().id])){ if (!remote) toast('Points are already awarded for this question.'); return; }
  if (isShowExclusive() && S.settings.timer > 0 && timerRem() <= 0){
    S.buzz.open = false;
    if (!remote) toast('The buzzer timer has expired.');
    return;
  }
  if (isShowExclusive() && !PQPShowBuzzer.canAccept(S.buzz, id, S.teams.map(x => x.id))){
    if (!remote) toast(showActive() ? `${teamName(showActive().id)} is answering. Wait for the host.` : S.buzz.order.some(b => b.id === id) ? 'Your team has already tried this question.' : 'Buzzers are closed.');
    return;
  }
  const lateOk = !isShowExclusive() && !S.buzz.open && S.buzz.closedAt > 0 && at <= S.buzz.closedAt;
  if (!S.buzz.open && !lateOk){ if (!remote) toast('Buzzers are closed.'); return; }
  const previous = S.buzz.order.find(b => b.id === id);
  if (previous){
    if (isClassic() && isAnswerRound() && S.buzz.open && !S.revealed){
      previous.ans = ans; previous.st = 'wait'; previous.hits = undefined;
      done();
    }
    return;
  }
  const entry = { id, t: at, st: 'wait' };
  if (isAnswerRound()) entry.ans = ans;
  const pos = S.buzz.order.findIndex(b => b.t > at);
  if (pos < 0) S.buzz.order.push(entry); else S.buzz.order.splice(pos, 0, entry);
  const firstIn = S.buzz.order.length === 1;
  if (isShowExclusive()){
    /* Atomic host-side first claim. No second queued contender until judged. */
    S.buzz.open = false;
    S.buzz.closedAt = now;
    timerPause();
    playCue('buzz', .58);
  } else if (isBatchScoring() || isAnswerRound()){
    playCue('buzz', firstIn ? .52 : .3);
    if (!isClassic() && S.buzz.order.length >= S.teams.length){ if (S.buzz.open) S.buzz.closedAt = now; S.buzz.open = false; timerPause(); }
  } else {
    const first = S.buzz.order.filter(b => b.st === 'wait').length === 1;
    if (first){ playCue('buzz', .52); timerPause(); } else playCue('buzz', .28);
  }
  done();
}

/* ---------- View routing ---------- */
function readHashView(){ const h = (location.hash || '').replace('#', ''); return ['host','player','setup'].includes(h) ? h : null; }
function setView(v){
  if (!['host','player','setup'].includes(v)) return;
  view = v;
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* sandboxed: ignore */ }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const v = readHashView(); if (v && v !== view){ view = v; render(); } });

/* ---------- Rendering ---------- */
function indicatorText(){
  const R = rounds();
  if (!totalQs()) return 'No questions loaded';
  if (S.lobby) return 'Buzzer check before the quiz';
  if (S.finished) return 'Final scores';
  if (S.between) return `End of round ${S.pos.r + 1} of ${R.length}`;
  return `Round ${S.pos.r + 1} of ${R.length}, question ${S.pos.q + 1} of ${curRound().questions.length}`;
}
function renderHeader(){
  $('#hTitle').textContent = S.quiz.title || 'Untitled quiz';
  $('#hIndicator').textContent = indicatorText();
  document.title = (S.quiz.title ? S.quiz.title + ' | ' : '') + 'Pub Quiz Powerhouse';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === view)));
  document.body.className = 'view-' + view;
  applyTheme();
  syncMusic();
}
function applyTheme(){
  const root = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') root.setAttribute('data-theme', S.theme);
  else root.removeAttribute('data-theme');
  const b = $('#themeBtn');
  b.textContent = S.theme === 'dark' ? '\u263E' : S.theme === 'light' ? '\u2600' : '\u25D0';
  b.setAttribute('aria-label', `Colour theme: ${S.theme}. Tap to change.`);
  b.title = `Theme: ${S.theme}`;
}
function sortedTeams(){ return S.teams.slice().sort((a, b) => b.score - a.score); }
function rankMap(){
  const m = new Map(); let prev = null, rank = 0;
  sortedTeams().forEach((t, i) => { if (t.score !== prev){ rank = i + 1; prev = t.score; } m.set(t.id, rank); });
  return m;
}
function teamStyle(t){ return `--c:${t.colour};--ci:${inkFor(t.colour)}`; }
function scoringLabel(q){
  if (q && isAnswerRound() && listAnswers(q)) return `${listAnswers(q).length} answers, a point each`;
  if (isWritten()) return q && q.pts > 1 ? `Written answer, ${q.pts} points` : 'Written answer';
  const base = q ? q.pts : 1;
  if (isClassic()) return `${base} ${base === 1 ? 'point' : 'points'} for every correct answer`;
  if (isShow()) return isAnswerRound() ? `Correct +${base}, fastest +2, second +1` : `First correct buzzer: ${plural(base, 'point')}`;
  return (isAnswerRound() && !isSpeed()) ? plural(base, 'point') + ' for every correct answer' : isSpeed() ? 'Fastest correct 2, second 1' : plural(base, 'point');
}

function timerHTML(){
  const rem = timerRem(), tot = S.settings.timer || 1;
  return `<div class="timer" data-timer><span class="timer-num" data-timer-num>${fmt(rem)}</span><div class="bar" aria-hidden="true"><i data-timer-bar style="width:${clamp(rem / tot * 100, 0, 100)}%"></i></div></div>`;
}
function emptyHTML(){
  return `<div class="card empty">
    <p class="q-text">No questions yet</p>
    <p class="muted">Load the ready-made starter quiz, or write your own questions in Setup.</p>
    <div class="row"><button class="btn primary big" data-act="quick-starter" type="button">Load starter quiz</button>
    <button class="btn sage big" data-act="nav" data-view="setup" type="button">Go to Setup</button></div></div>`;
}
function winnerHTML(){
  const s = sortedTeams(); if (!s.length) return '';
  const top = s[0].score; const leaders = s.filter(t => t.score === top);
  if (S.tb.winner && leaders.some(t => t.id === S.tb.winner)) return `<div class="winner-portraits"><span class="winner-portrait">${avatarHTML(team(S.tb.winner))}</span></div><p class="winner">\uD83C\uDFC6 ${esc(teamName(S.tb.winner))}</p><p class="winner-sub">Champions on the tiebreaker, with ${plural(top, 'point')}</p>`;
  const title = leaders.length > 1 ? `It\u2019s a tie: ${leaders.map(t => esc(t.name)).join(' & ')}` : `\uD83C\uDFC6 ${esc(leaders[0].name)}`;
  return `<div class="winner-portraits">${leaders.filter(t => !(S.tb.winner && !winningTeamIds(S).includes(t.id))).map(t => `<span class="winner-portrait">${avatarHTML(t)}</span>`).join('')}</div><p class="winner">${title}</p><p class="winner-sub">${leaders.length > 1 ? 'Joint winners' : 'Quiz champions'} with ${plural(top, 'point')}</p>`;

function podiumHTML(){
  const top = sortedTeams().slice(0,3);
  if (!top.length) return '';
  const rank = rankMap();
  return `<div class="podium" role="group" aria-label="Top three teams">${top.map((t, i) => `<div class="podium-team place-${i + 1}">
    <span class="podium-rank">${rank.get(t.id) === 1 ? '★' : rank.get(t.id)}</span>
    <span class="podium-face" style="${teamStyle(t)}">${avatarHTML(t)}</span>
    <strong>${esc(t.name)}</strong><span class="podium-points">${plural(t.score,'point')}</span>
    <span class="podium-plinth">${rank.get(t.id)}</span>
  </div>`).join('')}</div>`;
}
function boardHTML(){
  const s = sortedTeams(); if (!s.length) return `<p class="muted">No ${noun(true)} yet. Add them in Setup.</p>`;
  const ranks = rankMap(); const top = s[0].score;
  return `<div class="board board-premium">${s.map(t => `<div class="board-row ${t.score === top && top > 0 ? 'top' : ''}">
    <span>${ranks.get(t.id)}</span><span class="team-avatar-ring" style="${teamStyle(t)}">${avatarHTML(t)}</span>
    <span class="tname">${esc(t.name)}</span><span class="tscore">${t.score}</span></div>`).join('')}</div>`;
}

/* Host */
function renderHost(){
  if (!totalQs()) return emptyHTML();
  const r = curRound(), q = curQ();
  if (S.lobby){
    const items = S.teams.map((t, i) => { const ok = S.ready.includes(t.id);
      return `<li class="${ok ? 'right' : ''}"><span class="team-avatar-ring" style="${teamStyle(t)}">${avatarHTML(t)}</span><strong>${esc(t.name)}</strong><span class="spacer"></span>${S.net.on && NET.leader ? `<span class="muted">${plural(phoneCount(t.id), 'phone')}</span>` : ''}<span class="keycap">${keyFor(i)}</span><span class="${ok ? '' : 'muted'}">${ok ? '\u2714 Ready' : 'Waiting'}</span></li>`; }).join('');
    const pads = S.teams.map((t, i) => `<button class="mini-pad ${S.ready.includes(t.id) ? 'in' : ''}" style="${teamStyle(t)}" data-act="buzz" data-id="${t.id}" type="button">${keyFor(i)}: ${esc(t.name)}</button>`).join('');
    return `<section class="host-grid"><div class="col"><article class="card">
      <img class="host-lobby-logo" src="/assets/brand/master-crest.webp" alt="Pub Quiz Powerhouse" width="1100" height="1100" decoding="async"><div class="q-meta"><span class="pill">Before the quiz</span></div>
      <p class="q-text">Buzzer check</p>
      <p>Show the <strong>Player screen</strong> to the room. Each ${noun()} presses their key, or taps their colour, once to check in.</p>
      <ul class="queue" aria-live="polite">${items}</ul>
      <p class="hint">${S.ready.length} of ${S.teams.length} ready. You can start without everyone.</p>
      <div class="row" style="margin-top:10px">
        <button class="btn" data-act="nav" data-view="player" type="button">Show player screen</button>
        <button class="btn primary big" data-act="start-quiz" type="button">Start quiz</button>
      </div>
      <p class="hint">Tap to check in for a ${noun()}:</p><div class="mini-pads">${pads}</div>
    </article></div><div class="col">${scoreCard()}</div></section>`;
  }
  let left = '';
  if (S.finished){
    left = `<article class="card">
      <div class="q-meta"><span class="pill">Quiz complete</span></div>
      <div style="margin:16px 0">${winnerHTML()}</div>${tiebreakHostHTML()}
      <div class="row" style="justify-content:center">
        <button class="btn" data-act="prev" type="button">Back to last question</button>
        <button class="btn primary" data-act="restart" type="button">Play again from question 1</button>
      </div></article>`;
  } else if (S.between){
    const nr = nextNonEmpty(S.pos.r + 1); const next = nr >= 0 ? rounds()[nr] : null;
    left = `<article class="card">
      <div class="q-meta"><span class="pill">${esc(r.name)} complete</span></div>
      <p class="q-text">End of ${esc(r.name)}</p>
      <p class="muted">${S.recap ? 'This round\u2019s answers are showing on the player screen.' : 'The leaderboard is showing on the player screen.'}${next ? ` Up next: <strong>${esc(next.name)}</strong> (${plural(next.questions.length, 'question')}).` : ''}</p>
      ${betweenExtrasHTML(r)}
      <div class="row" style="margin-top:12px">
        <button class="btn" data-act="prev" type="button">Previous</button>
        <button class="btn primary big" data-act="next" type="button">${next ? 'Start ' + esc(next.name) : 'Finish quiz'}</button>
      </div></article>`;
  } else {
    left = `<article class="card">
      <div class="q-meta">
        <span class="pill">${esc(r.name)}</span>
        <span class="pill">${experienceName()}</span>
        ${!isLegacy() && !isWritten() ? `<span class="pill lifecycle" aria-label="Question status">${questionPhase()}</span>` : ''}
        <span class="pill">Question ${S.pos.q + 1} of ${r.questions.length}</span>
        <span class="pill pts">${scoringLabel(q)}</span>
        ${q.cat && q.cat !== r.name ? `<span class="pill">${esc(q.cat)}</span>` : ''}
        <span class="spacer"></span>
        <button class="btn sm" data-act="edit-current" type="button">Edit question</button>
      </div>
      ${r.info ? `<p class="hint">${esc(r.info)}</p>` : ''}${lettersHostHTML(r)}
      <p class="q-text">${esc(qText(q))}</p>
      <div class="answer-box ${S.revealed ? 'shown' : ''}">
        <span class="label">Correct answer, ${S.revealed ? 'now showing on the player screen' : 'hidden from players'}</span>
        <p class="a-text">${esc(q.a || '(no answer entered)')}</p>
        ${q.note ? `<p class="ans-note">${esc(q.note)}</p>` : ''}
        ${choiceHostHTML(q)}
      </div></article>
      <div class="card controls">
        <button class="btn" data-act="prev" type="button" ${atStart() ? 'disabled' : ''}>Previous</button>
        <button class="btn ${S.revealed ? '' : 'ok'}" data-act="reveal" type="button" aria-pressed="${S.revealed}" ${!isLegacy() && S.revealed ? 'disabled' : ''}>${S.revealed ? (isLegacy() ? 'Hide answer' : 'Answer revealed') : isAnswerRound() ? 'Lock, reveal and mark' : 'Show answer'}</button>
        ${!isLegacy() && !isWritten() ? `<button class="btn sm" data-act="skip-question" type="button" ${S.buzz.awarded ? 'disabled' : ''}>Skip for 0 points</button>` : ''}
        <button class="btn primary" data-act="next" type="button">${isLastInRound() ? (isLastRound() ? 'Finish quiz' : 'End round') : 'Next question'}</button>

      ? `<div class="card"><div class="section-head"><h2>Timer</h2></div>${timerHTML()}
         <div class="row" style="margin-top:12px"><button class="btn primary" data-act="timer-toggle" data-timer-btn type="button">Start timer</button>
         <button class="btn" data-act="timer-reset" type="button">Reset timer</button></div></div>`
      : `<div class="card"><p class="hint">The timer is off. Set a time per question in Setup.</p></div>`;
  }

function buzzCard(){
  const open = S.buzz.open, order = S.buzz.order, awarded = S.buzz.awarded;
  const t0 = order.length ? order[0].t : 0;
  const timeLabel = (b, i) => i === 0 ? 'first' : '+' + ((b.t - t0) / 1000).toFixed(2) + 's';
  let list, judgeBox = '';
  if (!order.length){
    list = `<p class="muted" aria-live="polite">${open ? 'Waiting for someone to buzz in.' : 'Buzzers are closed.'}</p>`;
  } else if (isBatchScoring()){
    const aw = speedAwards();
    list = `<ol class="queue" aria-live="polite">${order.map((b, i) => { const t = team(b.id); if (!t) return ''; const p = aw.get(b.id);
      return `<li class="${b.st === 'wait' ? '' : b.st}"><span class="team-avatar-ring" style="${teamStyle(t)}">${avatarHTML(t)}</span><strong>${i + 1}. ${esc(t.name)}</strong><span class="muted">${timeLabel(b, i)}</span><span class="spacer"></span>
        <span class="gain">${p ? '+' + p : ''}</span>
        <span class="mark">
          <button class="btn sm ${b.st === 'right' ? 'ok' : ''}" data-act="mark" data-id="${t.id}" data-st="right" type="button" aria-pressed="${b.st === 'right'}" aria-label="${esc(t.name)} correct" ${awarded ? 'disabled' : ''}>\u2714</button>
          <button class="btn sm ${b.st === 'wrong' ? 'bad' : ''}" data-act="mark" data-id="${t.id}" data-st="wrong" type="button" aria-pressed="${b.st === 'wrong'}" aria-label="${esc(t.name)} wrong" ${awarded ? 'disabled' : ''}>\u2718</button>
        </span></li>`; }).join('')}</ol>`;
    const any = Array.from(aw.values()).some(p => p > 0);
    judgeBox = awarded
      ? `<p class="hint">Question finalised. ${!isLegacy() ? '<button class="btn sm" data-act="reopen-current" type="button">Reopen marking</button>' : 'Press Undo on the scoreboard to change the points.'}</p>`
      : `<div class="judge"><p>${esc(scoringLabel(curQ()))}. Mark each ${noun()} \u2714 or \u2718, then award.</p>
         ${any ? `<button class="btn primary" data-act="award" type="button" ${!isLegacy() && (!S.revealed || order.some(b => b.st === 'wait')) ? 'disabled' : ''}>Award points</button>` : (!isLegacy() && S.revealed ? `<button class="btn" data-act="finalise-zero" type="button" ${order.some(b => b.st === 'wait') ? 'disabled' : ''}>Finalise: 0 points</button>` : '')}
         ${!isLegacy() && !S.revealed ? '<span class="hint">Reveal the answer to mark and finalise.</span>' : ''}</div>`;
  } else {
    const active = order.find(b => b.st === 'wait');
    const q = curQ(); const pts = q ? q.pts : 1;
    list = `<ol class="queue" aria-live="polite">${order.map((b, i) => { const t = team(b.id); if (!t) return '';
      const mark = b.st === 'right' ? ' \u2714 correct' : b.st === 'wrong' ? ' \u2718 wrong' : '';
      return `<li class="${b === active ? 'active' : b.st}"><span class="team-avatar-ring" style="${teamStyle(t)}">${avatarHTML(t)}</span><strong>${i + 1}. ${esc(t.name)}</strong><span class="spacer"></span><span class="muted">${timeLabel(b, i)}${mark}</span></li>`; }).join('')}</ol>`;
    if (active && team(active.id)) judgeBox = `<div class="judge"><p><strong>${esc(team(active.id).name)}</strong> to answer${isShowExclusive() ? ' — other buzzers locked' : ''}</p>
       <div class="row"><button class="btn ok" data-act="judge-right" type="button">Correct, +${pts}</button>
       <button class="btn bad" data-act="judge-wrong" type="button">Wrong${S.settings.penalty ? `, \u2212${pts}` : ''}</button></div></div>`;
    else if (isShowExclusive() && awarded){
      judgeBox = `<div class="judge"><p>This buzzer question is finalised.</p><button class="btn sm" data-act="reopen-current" type="button">Re-run question (reverses its scores)</button></div>`;
    }
    else if (isShowExclusive() && !awarded){
      const remaining = PQPShowBuzzer.remaining(S.buzz, S.teams.map(t => t.id)).length;
      judgeBox = `<div class="judge"><p>${S.revealed ? 'The answer is revealed. Finalise without a correct answer.' : open ? `Waiting for the next contender — ${remaining} ${noun(true)} eligible.` : `No active contender. ${remaining ? 'Buzzers are closed.' : 'Every team has tried.'}`}</p>${S.revealed ? '<button class="btn" data-act="finalise-zero" type="button">Finalise: no correct answer</button>' : ''}</div>`;
    }
  }
  const pads = S.teams.map((t, i) => `<button class="mini-pad ${order.some(b => b.id === t.id) ? 'in' : ''}" style="${teamStyle(t)}" data-act="buzz" data-id="${t.id}" type="button">${keyFor(i) ? keyFor(i) + ': ' : ''}${esc(t.name)}</button>`).join('');
  return `<section class="card">
    <div class="section-head"><h2>Buzzers</h2><span class="status ${open ? 'open' : 'closed'}">${open ? 'Open' : 'Closed'}</span></div>
    ${list}${judgeBox}
    <div class="row" style="margin-top:12px">
      <button class="btn sm" data-act="buzz-toggle" type="button" ${awarded || (isShowExclusive() && (!!showActive() || (open === false && PQPShowBuzzer.remaining(S.buzz,S.teams.map(t=>t.id)).length === 0))) ? 'disabled' : ''}>${open ? 'Close buzzers' : 'Open buzzers'}</button>
      <button class="btn sm" data-act="buzz-clear" type="button" ${order.length && !awarded ? '' : 'disabled'}>${isShowExclusive() ? 'Restart buzzer attempts' : 'Clear and reopen'}</button>
      <button class="btn sm" data-act="open-player-window" type="button">Open player window</button>
    </div>
    ${S.net.on ? `<p class="hint"><span class="net-status ${NET.status}" data-net-status>${netStatusText()}</span>${NET.leader ? `, ${plural(phonesOnline(), 'phone')} connected` : ''}</p>` : ''}
    <p class="hint">${isShowExclusive() ? 'First buzz locks the other teams. Judge Correct / Wrong before anybody else may buzz. Each team gets one attempt per question.' : `Buzz for a ${noun()} by tapping below, or with their key.`}</p>
    <div class="mini-pads">${pads || `<span class="muted">No ${noun(true)} yet.</span>`}</div></section>`;
}

function scoreCard(){
  const q = curQ();
  const pts = isShow() && isAnswerRound() ? (q ? q.pts + 2 : 3) : isSpeed() ? 2 : ((q && inPlay()) ? q.pts : 1);
  const ranks = rankMap();
  const rows = S.teams.map(t => `<div class="score-row" style="${teamStyle(t)}">
      <span class="rank">${ranks.get(t.id)}</span><span class="team-avatar-ring" style="${teamStyle(t)}">${avatarHTML(t)}</span>
      <span class="tname">${esc(t.name)}</span><span class="tscore">${t.score}</span>
      <span class="score-btns">
        <button class="btn sm" data-act="score" data-id="${t.id}" data-d="-1" type="button" aria-label="Take 1 point from ${esc(t.name)}">\u22121</button>
        <button class="btn sm" data-act="score" data-id="${t.id}" data-d="1" type="button" aria-label="Give 1 point to ${esc(t.name)}">+1</button>
        ${pts > 1 ? `<button class="btn sm primary" data-act="score" data-id="${t.id}" data-d="${pts}" type="button" aria-label="Give ${pts} points to ${esc(t.name)}">+${pts}</button>` : ''}
      </span></div>`).join('');
  const last = S.history[S.history.length - 1];
  return `<section class="card">
    <div class="section-head"><h2>Scoreboard</h2>
      <div class="row">
        <button class="btn sm" data-act="undo" type="button" ${S.history.length ? '' : 'disabled'}>Undo</button>
        <button class="btn sm" data-act="round-scores" type="button">Add points</button>
        <button class="btn sm ${S.showBoard ? 'primary' : ''}" data-act="board-toggle" type="button" aria-pressed="${S.showBoard}" ${S.lobby ? 'disabled' : ''}>${S.showBoard ? 'Hide leaderboard' : 'Show leaderboard'}</button>

    ${last && team(last.id) ? `<p class="hint">Last change: ${esc(teamName(last.id))} ${last.d > 0 ? '+' : ''}${last.d} (${esc(last.label)})</p>` : ''}
  </section>`;
}

/* Player screen */
function renderPlayer(){
  if (!totalQs()) return emptyHTML();
  const duel = isDuel() ? 'duel' : '';
  const tools = SCREEN ? `<div class="row stage-tools">
    <button class="btn sm" data-act="fullscreen" type="button">Full screen</button>
    ${S.net.on && !S.lobby ? `<button class="btn sm" data-act="show-join" type="button">${showJoin ? 'Hide join code' : 'Join code'}</button>` : ''}
    <button class="btn sm" data-act="screen-forget" type="button">Show a different quiz</button></div>` : `<div class="row stage-tools">
    <button class="btn sm" data-act="fullscreen" type="button">Full screen</button>
    ${S.net.on && !S.lobby ? `<button class="btn sm" data-act="show-join" type="button">${showJoin ? 'Hide join code' : 'Join code'}</button>` : ''}
    ${S.finished || S.lobby ? '' : `<button class="btn sm" data-act="board-toggle" type="button">${S.showBoard ? 'Back to question' : 'Leaderboard'}</button>`}
    ${S.teams.length && (S.lobby || (!isWritten() && !isAnswerRound())) ? `<span class="hint">Buzz: tap your colour or press ${keysText()}</span>` : ''}</div>`;
  if (S.lobby){
    const pads = S.teams.map((t, i) => { const ok = S.ready.includes(t.id);
      return `<button class="pad ${ok ? 'is-ready' : ''}" style="${teamStyle(t)}" data-act="buzz" data-id="${t.id}" type="button" aria-label="Check in ${esc(t.name)}">
        ${avatarHTML(t)}<span class="key">Key ${keyFor(i)}</span><span class="pad-name">${esc(t.name)}</span><span class="ready">${ok ? '\u2714 Ready' : 'Press to check in'}</span></button>`; }).join('');
    return `<section class="stage tv-lobby"><img class="tv-lobby-logo" src="/assets/brand/master-crest.webp" alt="Pub Quiz Powerhouse" width="1100" height="1100" decoding="async"><span class="kicker stage-kicker">WELCOME TO QUIZ NIGHT LIVE</span><h2 class="stage-title">Make some noise.</h2>
      <p class="stage-sub">${S.net.on ? 'Scan the code with your phone camera to use it as your buzzer. No phone? Press your key or tap your colour.' : 'Press your key or tap your colour once to check in. The quiz starts when the host is ready.'}</p>
      ${joinPanelHTML()}
      <div class="pads ${duel}">${pads}</div>${tools}</section>`;
  }
  if (S.finished) return `<section class="stage finals-stage"><img class="final-brand-logo" src="/assets/brand/header-wordmark.webp" alt="Pub Quiz Powerhouse" width="1200" height="400" decoding="async">${tiebreakPlayerHTML() || (winnerHTML() + podiumHTML() + boardHTML())}${tools}</section>`;
  if (S.between || S.showBoard){
    const cr = curRound();
    const title = S.recap ? `${esc(cr.name)}: the answers` : S.between ? `End of ${esc(cr.name)}` : 'Leaderboard';
    const tiles = cr && cr.type === 'letters' && (S.between || S.recap) ? lettersHTML(cr, true) : '';
    return `<section class="stage"><h2 class="stage-title">${title}</h2>${tiles}${S.recap ? recapHTML(cr) : boardHTML()}${tools}</section>`;
  }
  const r = curRound(), q = curQ();
  const order = S.buzz.order;
  let banner = '';
  let aw = null;
  if (isWritten()) banner = '<div class="buzz-banner quiet">Write your answer on your team\u2019s sheet</div>';
  else if (isAnswerRound()) banner = '';
  else if (isBatchScoring()){
    aw = speedAwards();
    const gains = Array.from(aw).filter(([, p]) => p > 0);
    if (S.buzz.awarded && gains.length) banner = `<div class="buzz-banner right">${gains.map(([id, p]) => `${esc(teamName(id))} +${p}`).join(', ')}</div>`;
    else if (order.length) banner = `<div class="buzz-banner">${order.length} of ${S.teams.length} locked in. Fastest: ${esc(teamName(order[0].id))}</div>`;
    else if (!S.buzz.open && !S.revealed) banner = `<div class="buzz-banner quiet">Buzzers are closed</div>`;
  } else {
    const active = order.find(b => b.st === 'wait');
    const right = order.find(b => b.st === 'right');
    if (isShowExclusive()){
      const misses = order.filter(b=>b.st==='wrong').length;
      if (right) banner = `<div class="buzz-banner right show-callout show-victory" role="status"><span class="show-callout-kicker">CORRECT BUZZER · POINTS AWARDED</span><strong>${esc(teamName(right.id))} +${curQ() ? curQ().pts : 1}</strong></div>`;
      else if (active) banner = `<div class="buzz-banner show-callout" role="status"><span class="show-callout-kicker">FIRST BUZZ · EXCLUSIVE TURN</span><strong>${esc(teamName(active.id))}</strong><span>Other buzzers locked · Timer paused · ${misses} previous attempt${misses===1?'':'s'}</span></div>`;
      else if (S.revealed) banner = `<div class="buzz-banner quiet">Answer revealed · no winning buzzer</div>`;
      else if (S.buzz.open) banner = `<div class="buzz-banner quiet show-ready">BUZZERS OPEN · ${PQPShowBuzzer.remaining(S.buzz, S.teams.map(t=>t.id)).length} ELIGIBLE</div>`;
      else banner = `<div class="buzz-banner quiet">Buzzers closed · awaiting reveal</div>`;
    } else if (right) banner = `<div class="buzz-banner right">${esc(teamName(right.id))} got it!</div>`;
    else if (active) banner = `<div class="buzz-banner">${esc(teamName(active.id))} buzzed first!</div>`;
    else if (!S.buzz.open && !S.revealed) banner = `<div class="buzz-banner quiet">Buzzers are closed</div>`;
  }
  const activeClassic = isBatchScoring() ? null : order.find(b => b.st === 'wait');
  const pads = S.teams.map((t, i) => {
    const idx = order.findIndex(b => b.id === t.id); const b = order[idx];
    const cls = [idx >= 0 ? 'in' : '', b && b === activeClassic ? 'first' : '', b && b.st === 'wrong' ? 'wrong' : '', b && b.st === 'right' ? 'right' : '', isShowExclusive() && activeClassic && (!b || b !== activeClassic) ? 'show-locked' : ''].join(' ');
    let badge = '';
    if (idx >= 0){
      const p = aw && S.buzz.awarded ? aw.get(t.id) : 0;
      badge = p ? `<span class="order gain">+${p}</span>` : `<span class="order">${idx + 1}</span>`;
    }
    return `<button class="pad ${cls}" style="${teamStyle(t)}" data-act="buzz" data-id="${t.id}" type="button" aria-label="Buzz for ${esc(t.name)}">
      ${avatarHTML(t)}${keyFor(i) ? `<span class="key">${keyFor(i)}</span>` : ''}<span class="pad-name">${esc(t.name)}</span>${badge}</button>`;
  }).join('');
  return `<section class="stage ${isShowExclusive() ? 'show-exclusives' : ''}">
    ${showJoin && S.net.on ? joinPanelHTML() : ''}
    <div class="stage-top"><span>${esc(r.name)} · ${experienceName()}</span><span>Question ${S.pos.q + 1} of ${r.questions.length}</span><span>${scoringLabel(q)}</span></div>
    ${r.info ? `<p class="stage-info">${esc(r.info)}</p>` : ''}
    ${lettersHTML(r, true)}
    ${r.type === 'letters' && r.clue && lxFlags().clue ? `<p class="stage-clue">Clue: ${esc(r.clue)}</p>` : ''}
    <p class="stage-q">${esc(qText(q))}</p>
    ${S.revealed ? `<div class="stage-answer">${esc(q.a || '(no answer entered)')}${q.note ? `<span class="note">${esc(q.note)}</span>` : ''}</div>` : ''}
    ${S.settings.timer > 0 ? `<div class="stage-timer">${timerHTML()}</div>` : ''}
    ${banner}
    ${isAnswerRound() ? answerStageHTML(q) : isWritten() ? '' : `<div class="pads ${duel} ${S.buzz.open ? '' : 'closed'}">${pads}</div>`}
    ${tools}</section>`;
}

}</pre></details></section>`;

  return `<div class="setup">${intro}${step1}${step2}${step3}${step4}${settingsCard}${editorCard}${tiebreakEditorHTML()}${dataCard}</div>`;
}

let pendingRender = false;
function render(){
  if (SCREEN && !SCREEN_LIVE) return;
  pendingRender = false;
  const ae = document.activeElement;
  let focusKey = null;
  if (ae && main.contains(ae) && ae.dataset && ae.dataset.act){
    focusKey = `[data-act="${ae.dataset.act}"]` + ['id','r','q','d','view','st','mode','i'].map(k => ae.dataset[k] != null ? `[data-${k}="${CSS.escape(ae.dataset[k])}"]` : '').join('');
  }
  renderHeader();
  main.innerHTML = (view !== 'player' && !SCREEN ? phoneApprovalHTML() : '') + (view === 'player' ? renderPlayer() : view === 'setup' ? renderSetup() : renderHost());
  paintTimer();
  if (focusKey){ const el = main.querySelector(focusKey); if (el && !el.disabled){ try { el.focus({ preventScroll: true }); } catch (e) {} } }
}

  modal.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">${html}</div>`;
  modal.hidden = false;

}
function closeModal(){
  modal.hidden = true; modal.innerHTML = '';
  if (lastFocus && document.contains(lastFocus)){ try { lastFocus.focus(); } catch (e) {} }
}
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function ask(title, msg, yesLabel, onYes, danger){

/* ---------- Question editor ---------- */
function openQEditor(ri, qi){
  const R = rounds(); if (!R[ri]) return;
  const isNew = qi == null;
  const q = isNew ? { q: '', a: '', pts: 1, cat: R[ri].name, note: '' } : R[ri].questions[qi];
  if (!q) return;
  showModal(`<h2>${isNew ? 'Add a question' : 'Edit question'}</h2>
    <label class="field">Round<select id="mRound">${R.map((x, i) => `<option value="${i}" ${i === ri ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label class="field">Question<textarea id="mQ" rows="3" maxlength="600">${esc(q.q)}</textarea></label>
    <label class="field">Correct answer<input id="mA" maxlength="300" value="${esc(q.a)}"></label>
    <label class="field">Answer note (optional, shown under the answer)<input id="mN" maxlength="400" value="${esc(q.note || '')}"></label>
    <div class="field">Wrong options for multiple choice (optional)
      ${[0, 1, 2].map(i => `<input id="mW${i}" maxlength="200" value="${esc((q.wrong || [])[i] || '')}" aria-label="Wrong option ${i + 1}" placeholder="Wrong option ${i + 1}">`).join('')}
      <button class="btn sm" id="mSuggest" type="button">Suggest wrong options</button></div>
    <div class="row2">
      <label class="field">Points${isSpeed() ? ' (question points scoring only)' : ''}<input id="mP" type="number" min="0" max="100" value="${q.pts}" inputmode="numeric"></label>
      <label class="field">Category<input id="mC" maxlength="60" value="${esc(q.cat)}"></label>
    </div>
    <div class="modal-actions">
      <button class="btn" data-act="modal-close" type="button">Cancel</button>
      ${isNew ? '<button class="btn" id="mSaveMore" type="button">Save and add another</button>' : ''}
      <button class="btn primary" id="mSave" type="button">Save question</button>
    </div>`);
  $('#mQ').focus();
  const doSave = more => {
    const newR = +$('#mRound').value;
    const data = { q: $('#mQ').value.trim(), a: $('#mA').value.trim(), pts: clampPts($('#mP').value), cat: $('#mC').value.trim(), note: $('#mN').value.trim(), wrong: [0, 1, 2].map(i => $('#mW' + i).value.trim()).filter(Boolean) };
    if (!data.q){ toast('Type the question first.'); $('#mQ').focus(); return; }
    keepCurrent(() => {
      if (isNew) rounds()[newR].questions.push(Object.assign({ id: uid() }, data));
      else {
        const obj = rounds()[ri].questions[qi];
        Object.assign(obj, data);
        if (newR !== ri){ rounds()[ri].questions.splice(qi, 1); rounds()[newR].questions.push(obj); }
      }
    });
    if (!curQ()) clampPos();
    commit();
    if (more){
      $('#mQ').value = ''; $('#mA').value = ''; $('#mN').value = ''; [0, 1, 2].forEach(i => { $('#mW' + i).value = ''; }); $('#mQ').focus();
      toast('Question saved. Add the next one.');
    } else { closeModal(); toast(isNew ? 'Question saved' : 'Changes saved'); }
  };
  $('#mSuggest').addEventListener('click', () => {
    const a = $('#mA').value.trim(); if (!a){ toast('Type the correct answer first.'); return; }
    const have = [0, 1, 2].map(i => $('#mW' + i).value.trim()).filter(Boolean);
    const extra = makeWrong({ id: 'x', q: $('#mQ').value, a }, 3 - have.length, have);
    const all = have.concat(extra);
    [0, 1, 2].forEach(i => { $('#mW' + i).value = all[i] || ''; });
    toast(extra.length ? 'Suggestions added. Change any that are too easy.' : 'Couldn\u2019t suggest options for that answer.');
  });
  $('#mSave').addEventListener('click', () => doSave(false));
  const more = $('#mSaveMore'); if (more) more.addEventListener('click', () => doSave(true));
}

/* ---------- Import / export ---------- */
function exportData(){
  return JSON.stringify({
    app: 'pub-quiz-powerhouse', version: 1,
    quiz: {
      title: S.quiz.title,
      rounds: rounds().map(r => ({ name: r.name, info: r.info, type: r.type, mystery: r.mystery, clue: r.clue, mode: r.mode, questions: r.questions.map(q => ({ q: q.q, a: q.a, pts: q.pts, cat: q.cat, note: q.note, wrong: q.wrong || [] })) })),
      tiebreakers: S.quiz.tiebreakers.map(t => ({ q: t.q, a: t.a, note: t.note }))
    },
    teams: S.teams.map(t => ({ name: t.name, colour: t.colour, avatar: t.avatar }))
  }, null, 2);
}
function importData(text){
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('That isn\u2019t valid quiz data. Check it was copied in full.'); return; }
  let quiz;
  try { quiz = normaliseQuiz(d && d.quiz ? d.quiz : d); } catch (e) { toast('Import failed: ' + e.message + '.'); return; }
  const n = quiz.rounds.reduce((a, r) => a + r.questions.length, 0);
  if (!n){ toast('Import failed: the data has no questions.'); return; }
  const hasTeams = d && Array.isArray(d.teams) && d.teams.length > 0;
  ask('Import this quiz?', `${quiz.title}: ${plural(quiz.rounds.length, 'round')}, ${plural(n, 'question')}. This replaces your current quiz${hasTeams ? ' and ' + noun(true) : ''} and resets scores.`, 'Import quiz', () => {
    S.quiz = quiz;
    if (hasTeams){
      S.teams = normTeams(d.teams).map(t => Object.assign(t, { score: 0 }));
      if (isDuel() && S.teams.length !== 2) S.settings.mode = 'teams';
    }
    restartGame(); commit();
    toast('Quiz imported');
  });
}
function downloadExport(){
  try {
    const blob = new Blob([exportData()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (S.quiz.title || 'quiz').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Download started. If nothing appears, use Show quiz data and Copy instead.');
  } catch (e) { toast('Downloads are blocked here. Use Show quiz data and Copy instead.'); }
}
async function copyJson(){
  const ta = $('#fJson'); if (!ta) return;
  if (!ta.value.trim()) ta.value = exportData();
  try { await navigator.clipboard.writeText(ta.value); toast('Copied to clipboard'); }
  catch (e) {
    ta.focus(); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e2) { toast('Select the text in the box and copy it manually.'); }
  }
}

/* ---------- Starter pack ---------- */
function readStarterForm(){
  const cats = Array.from(main.querySelectorAll('input[name="cat"]:checked')).map(i => i.value);
  const per = clamp(+($('#fPer') ? $('#fPer').value : 8) || 8, 1, 8);
  const mix = !!($('#fShuffle') && $('#fShuffle').checked);
  const mode = $('#fMode') ? $('#fMode').value : 'choice';
  return { cats, per, mix, mode };
}

/* ---------- Mode switching ---------- */
function setMode(m){
  if (m === S.settings.mode || !['teams','duel'].includes(m)) return;
  const apply = () => {
    S.settings.mode = m;
    if (m === 'duel'){
      const keep = S.teams.slice(0, 2);
      while (keep.length < 2) keep.push(newTeam(`Player ${keep.length + 1}`, keep));
      keep.forEach((t, i) => { if (DEFAULT_TEAM_NAMES.includes(t.name) || /^Team \d+$/.test(t.name)) t.name = `Player ${i + 1}`; });
      S.teams = keep;
    }
    restartGame(); commit();
    toast(m === 'duel' ? 'Head to head: 2 players' : 'Teams: add up to 10 teams');
  };
  const scored = S.teams.some(t => t.score);
  if ((m === 'duel' && S.teams.length > 2) || scored){
    ask('Switch how you\u2019re playing?', (m === 'duel' ? `Head to head keeps the first 2 ${noun(true)} and removes the rest. ` : '') + 'All scores reset to 0.', 'Switch', apply);
  } else apply();
}

function setExperience(next){
  if (!['classic','show'].includes(next) || next === S.settings.experience) return;
  const apply = () => {
    const prior = S.settings.experience;
    S.settings.experience = next;
    S.settings.scoring = next === 'classic' ? 'points' : 'speed';
    S.settings.penalty = false;
    S.settings.timer = next === 'classic' ? 0 : 20;
    S.settings.autoTimer = next === 'show';
    if (prior === 'legacy' || !S.lobby || S.teams.some(t => t.score !== 0)) restartGame();
    else resetForQuestion(true);
    commit();
    toast(experienceName() + ' selected');
  };
  if (!S.lobby || S.teams.some(t => t.score !== 0))
    ask('Start a new experience?', 'Switching experiences resets this quiz night and all scores to zero. Your teams, avatars, and quiz questions are kept.', 'Reset and switch', apply);
  else apply();
}

/* ---------- Actions ---------- */
function swap(arr, i, j){ if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
const ACT = {
  'avatar-open': b => openAvatarPicker(b.dataset.id),
  'avatar-pick': b => {
    const t = team(b.dataset.id); if (!t || !AVATAR_IDS.includes(b.dataset.avatar)) return;
    t.avatar = b.dataset.avatar; closeModal(); commit(); toast(`${t.name}: character updated`);
  },
  nav: b => setView(b.dataset.view),
  theme: () => { S.theme = S.theme === 'auto' ? 'light' : S.theme === 'light' ? 'dark' : 'auto'; save(); applyTheme(); toast(`Theme: ${S.theme === 'auto' ? 'matches your device' : S.theme}`); },
  help: showHelp,
  'modal-close': closeModal,
  'start-quiz': startQuiz,
  'set-mode': b => setMode(b.dataset.mode),
  'set-experience': b => setExperience(b.dataset.experience),
  prev: goPrev, next: goNext, 'next-round': goNextRound, reveal: toggleReveal,
  'edit-current': () => { if (curQ()) openQEditor(S.pos.r, S.pos.q); },
  'timer-toggle': () => { if (S.timer.running) timerPause(); else timerStart(); commit(); },
  'timer-reset': () => { timerReset(); commit(); },
  buzz: b => buzz(b.dataset.id),
  'buzz-toggle': () => { if (S.buzz.awarded || !inPlay()) return; if (!isLegacy() && S.revealed){ toast('Answers have been revealed. Reopen marking to correct results.'); return; } if (isShowExclusive() && (showActive() || (!S.buzz.open && !PQPShowBuzzer.remaining(S.buzz,S.teams.map(t=>t.id)).length) || (!S.buzz.open && S.settings.timer > 0 && timerRem() <= 0))){ toast('Judge the active buzzer, or no further teams are eligible.'); return; } S.buzz.open = !S.buzz.open; S.buzz.closedAt = S.buzz.open ? 0 : Date.now(); if (!S.buzz.open) timerPause(); commit(); },
  'buzz-clear': () => { if (S.buzz.awarded || (!isLegacy() && S.revealed)) return;
    if (isShowExclusive() && S.buzz.g) removeGroup(S.buzz.g);
    S.buzz = { open: true, order: [], awarded: false, g: null, n: uid(), closedAt: 0 };
    timerReset(); if (S.settings.autoTimer) timerStart(); commit(); },
  mark: b => markBuzz(b.dataset.id, b.dataset.st),
  award: () => { if (awardSpeed(false)) commit(); },
  'finalise-zero': () => { if (finaliseZero(false)) commit(); },
  'reopen-current': reopenCurrentAward,
  'skip-question': skipCurrent,
  'host-typed': b => {
    if (!isClassic() || !isTyped() || !inPlay() || !S.buzz.open || S.revealed) return;
    const t = team(b.dataset.id); if (!t) return;
    const prev = S.buzz.order.find(x => x.id === t.id);
    showModal(`<h2>Answer for ${esc(t.name)}</h2><p class="hint">This will be marked when you reveal the answer.</p><label class="field">Typed answer<input id="manualTypedAnswer" maxlength="160" value="${esc(prev && prev.ans !== undefined ? prev.ans : '')}"></label><div class="modal-actions"><button class="btn" data-act="modal-close" type="button">Cancel</button><button class="btn primary" id="manualTypedSubmit" type="button">Save answer</button></div>`);
    $('#manualTypedSubmit').addEventListener('click', () => {
      const value = $('#manualTypedAnswer').value.trim(); if (!value){ toast('Enter an answer.'); return; }
      closeModal(); buzz(t.id, undefined, value);
    });
    $('#manualTypedAnswer').focus();
  },
  'judge-right': () => judge(true),
  'judge-wrong': () => judge(false),
  score: b => { addScore(b.dataset.id, +b.dataset.d, 'Manual'); commit(); },
  undo,
  'board-toggle': () => { if (S.lobby) return; S.showBoard = !S.showBoard; commit(); },
  fullscreen: toggleFullscreen,
  'open-player-window': () => {
    let w = null;
    try { w = window.open(location.href.split('#')[0] + '#player', 'pqp_player'); } catch (e) { w = null; }
    toast(w ? 'Player window opened. Drag it to the TV and press F.' : 'Pop-up blocked. Open this page in a second window and choose Player screen.');
  },
  restart: () => ask('Restart the quiz?', `This goes back to the buzzer check, then question 1. Every ${noun()}\u2019s score goes back to 0.`, 'Restart quiz', () => { restartGame(); commit(); toast('Quiz restarted'); }),
  'quick-starter': () => { S.quiz.rounds = starterRounds(DEFAULT_CATS, 8, 1, false, 'choice'); if (!S.quiz.tiebreakers.length) S.quiz.tiebreakers = starterTiebreakers(); restartGame(); commit(); toast('Starter quiz loaded'); },
  'new-quiz': () => ask('Start a new blank quiz?', `This deletes every round and question and resets scores. ${Noun(true)} are kept. Download your current quiz first if you want to keep it.`, 'Start blank quiz', () => {
    S.quiz = { title: 'New Quiz', rounds: [makeRound('Round 1', [], 1)], tiebreakers: [] };

  'starter-replace': () => {

  'round-up': b => { keepCurrent(() => swap(rounds(), +b.dataset.r, +b.dataset.r - 1)); commit(); },
  'round-down': b => { keepCurrent(() => swap(rounds(), +b.dataset.r, +b.dataset.r + 1)); commit(); },

  'q-down': b => { keepCurrent(() => swap(rounds()[+b.dataset.r].questions, +b.dataset.q, +b.dataset.q + 1)); commit(); },
  'q-del': b => {
    const r = rounds()[+b.dataset.r]; const q = r && r.questions[+b.dataset.q]; if (!q) return;
    ask('Delete this question?', q.q.length > 120 ? q.q.slice(0, 117) + '\u2026' : q.q, 'Delete question', () => {

      commit();
    }, true);
  },
  'q-go': b => {

  },
  'recap-toggle': () => { S.recap = !S.recap; commit(); },
  'lib-play': b => openLibPlay(b.dataset.lib),
  'lib-del': b => {
    const it = libItems().find(x => x.id === b.dataset.lib); if (!it) return;
    ask(`Delete ${it.title}?`, 'It\u2019s removed from the library in this browser. The quiz that\u2019s loaded now isn\u2019t affected.', 'Delete quiz', () => {
      libStore(libItems().filter(x => x.id !== it.id)); if (S.quiz.libId === it.id) S.quiz.libId = ''; commit(); toast('Quiz deleted');
    }, true);
  },
  'lib-save': () => {

    const i = items.findIndex(x => x.id === S.quiz.libId);
    if (i >= 0){ items[i].quiz = ex; items[i].title = ex.title; }
    else { const id = 'u' + uid(); items.push({ id, title: ex.title, added: Date.now(), quiz: ex }); S.quiz.libId = id; }
    if (libStore(items)){ commit(); toast(i >= 0 ? 'Library copy updated' : 'Saved to the library'); }
  },
  answer: b => buzz(b.dataset.id, undefined, +b.dataset.c),
  'opts-make': b => { const r = rounds()[+b.dataset.r]; if (!r) return; const n = fillOptions(r, !!b.dataset.all); commit(); toast(n ? `Options made for ${plural(n, 'question')}. Check they make sense.` : 'Every question already has options.'); },
  'round-scores': b => openScoreModal(b.dataset.r != null ? +b.dataset.r : null),
  'lx-clue': () => { const r = curRound(); if (!r) return; const f = lxFlags(); S.lx = { rid: r.id, clue: !f.clue, mystery: f.mystery }; commit(); },
  'lx-mystery': () => { const r = curRound(); if (!r) return; const f = lxFlags(); S.lx = { rid: r.id, clue: f.clue, mystery: !f.mystery }; commit(); },
  'tb-start': () => { S.tb = { on: true, i: 0, guesses: {}, shown: false, winner: null }; commit(); },
  'tb-reveal': () => { S.tb.shown = true; commit(); },
  'tb-next': () => { S.tb = { on: true, i: S.tb.i + 1, guesses: {}, shown: false, winner: null }; commit(); },
  'tb-win': b => { if (!team(b.dataset.id)) return; S.tb.winner = b.dataset.id; commit(); fanfare(); toast(`${teamName(b.dataset.id)} win on the tiebreaker!`); },
  'tb-reset': () => { S.tb = { on: false, i: 0, guesses: {}, shown: false, winner: null }; commit(); },
  'tb-add': () => { if (S.quiz.tiebreakers.length >= 10) return; S.quiz.tiebreakers.push({ id: uid(), q: '', a: '', note: '' }); commit(); },
  'tb-del': b => { S.quiz.tiebreakers.splice(+b.dataset.i, 1); commit(); },
  'import-open': () => openImport(),
  'buzz-mode': b => {
    const on = b.dataset.net === '1';
    if (on === S.net.on) return;
    if (on){ if (!S.net.room) S.net.room = newRoom(); S.net.on = true; commit(); leaderTick(); toast('Phone buzzers on'); }
    else { netAnnounceClose(); S.net.on = false; commit(); leaderTick(); toast('Phone buzzers off'); }
  },
  'net-newroom': () => ask('Make a new room code?', 'Phones already connected will need to scan the new QR code, and TV screens will need connecting again.', 'New room code', () => { netAnnounceClose(); S.net.room = newRoom(); S.net.key = newKey(); commit(); toast(`New room code: ${S.net.room}`); }),
  'tv-pair': () => {
    const el = $('#tvCode'); const code = el ? el.value.replace(/\D/g, '') : '';
    if (code.length !== 4){ toast('Type the 4-digit code shown on the TV.'); if (el) el.focus(); return; }
    if (!NET.leader || !NET.client || !NET.client.online || !NET.client.socket){ toast('Still connecting to the quiz server. Try again in a moment.'); return; }
    NET.client.socket.emit('pair', { code, room: S.net.room, key: screenKey() }, r => {
      if (r && r.ok){ if (el) el.value = ''; publishState(true); toast('TV connected'); }
      else toast((r && r.error) || 'That didn\u2019t work. Check the code and try again.');
    });
  },
  'net-broker': () => ask('Switch buzzer server?', 'Use this if phones can’t connect. Phones already connected will need to scan the new QR code.', 'Switch server', () => {
    netAnnounceClose(); S.net.broker = (S.net.broker + 1) % BROKERS.length; commit(); toast(`Using buzzer server ${S.net.broker + 1} of ${BROKERS.length}`);
  }),
  'phone-approve': b => approveJoin(b.dataset.cid),
  'phone-reject': b => rejectJoin(b.dataset.cid),
  'copy-join': async () => { const u = joinURL(); if (!u) return; try { await navigator.clipboard.writeText(u); toast('Join link copied'); } catch (e) { toast(u); } },
  'show-join': () => { showJoin = !showJoin; render(); },
  'export-show': () => { const ta = $('#fJson'); if (ta){ ta.value = exportData(); ta.focus(); ta.select(); } },
  'export-download': downloadExport,
  'json-copy': copyJson,
  'json-import': () => { const ta = $('#fJson'); if (!ta || !ta.value.trim()){ toast('Paste quiz data into the box first.'); return; } importData(ta.value); }
};

const SCREEN_ACTS = ['fullscreen', 'show-join', 'screen-forget', 'modal-close'];
document.addEventListener('click', e => {
  if (SCREEN) unlockAudio();
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (SCREEN && !SCREEN_ACTS.includes(b.dataset.act)){ e.preventDefault(); return; }
  const f = ACT[b.dataset.act];
  if (!f) return;
  e.preventDefault();
  unlockAudio();
  f(b);
});

/* Field bindings in Setup (on change, so typing never loses focus) */
main.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fLib'){ addLibraryFiles(el.files); el.value = ''; return; }
  if (el.id === 'fFile'){
    const file = el.files && el.files[0]; el.value = '';
    if (!file) return;
    if (file.size > 3e6){ toast('That file is too large to be quiz data.'); return; }
    const rd = new FileReader();
    rd.onload = () => importData(String(rd.result));
    rd.onerror = () => toast('That file couldn\u2019t be read.');
    rd.readAsText(file);
    return;
  }
  const bind = el.dataset && el.dataset.bind; if (!bind) return;
  if (bind === 'title'){ S.quiz.title = el.value.trim().slice(0, 80) || 'Untitled quiz'; save(); renderHeader(); }
  else if (bind === 'team-name'){ const t = team(el.dataset.id); if (t){ t.name = el.value.trim().slice(0, 40) || t.name; el.value = t.name; save(); } }
  else if (bind === 'team-colour'){ const t = team(el.dataset.id); if (t && isHex(el.value)){ t.colour = el.value.toLowerCase(); commit(); } }
  else if (bind === 'round-name'){ const r = rounds()[+el.dataset.r]; if (r){ r.name = el.value.trim().slice(0, 60) || r.name; el.value = r.name; save(); renderHeader(); } }
  else if (bind === 'set-timer'){
    S.settings.timer = clamp(Math.round(+el.value) || 0, 0, 600); el.value = S.settings.timer;
    if (!S.timer.running) S.timer.rem = S.settings.timer;
    save();
  }
  else if (bind === 'set-scoring'){ if (isLegacy() && el.checked){ S.settings.scoring = el.value === 'points' ? 'points' : 'speed'; S.buzz.order.forEach(b => { b.st = 'wait'; }); commit(); toast(isSpeed() ? 'Speed scoring: 2, 1, 0' : 'Question points scoring'); } }
  else if (bind === 'round-field'){
    const r = rounds()[+el.dataset.r], f = el.dataset.f; if (!r) return;
    if (f === 'mode'){ r.mode = ['choice', 'typed', 'buzz', 'written'].includes(el.value) ? el.value : 'buzz'; if (r.mode === 'choice') fillOptions(r, false); }
    else if (f === 'type') r.type = el.value === 'letters' ? 'letters' : 'standard';
    else if (f === 'info' || f === 'clue') r[f] = el.value.trim().slice(0, 400);
    else if (f === 'mystery') r.mystery = el.value.trim().toUpperCase().slice(0, 60);
    if (f === 'mode' || f === 'type') commit(); else save();
  }
  else if (bind === 'tb-field'){ const t = S.quiz.tiebreakers[+el.dataset.i]; if (t){ if (el.dataset.f === 'a') t.a = el.value.trim().slice(0, 200); else t.q = el.value.trim().slice(0, 600); save(); } }
  else if (bind === 'tb-guess'){ if (team(el.dataset.id)){ S.tb.guesses[el.dataset.id] = el.value.trim().slice(0, 20); save(); } }
  else if (bind === 'net-url'){ let v = el.value.trim(); if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v; S.net.url = v.slice(0, 300); commit(); }
  else if (bind === 'net-allow'){ S.net.allowNew = el.checked; save(); }
  else if (bind === 'net-approval'){ S.net.requireApproval = el.checked; commit(); }
  else if (bind === 'set'){ const k = el.dataset.k; if (k in S.settings){ S.settings[k] = el.checked; save(); if (k === 'music' || k === 'sound') syncMusic(); } }
});
main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'fNewTeam'){ e.preventDefault(); ACT['team-add'](); }
  if (e.key === 'Enter' && e.target.id === 'tvCode'){ e.preventDefault(); ACT['tv-pair'](); }
});

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (SCREEN){ unlockAudio(); if (!modal.hidden){ if (e.key === 'Escape'){ e.preventDefault(); closeModal(); } return; } if (e.key.toLowerCase() === 'f'){ e.preventDefault(); toggleFullscreen(); } return; }
  if (!modal.hidden){ if (e.key === 'Escape'){ e.preventDefault(); closeModal(); } return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.target.isContentEditable) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (tag === 'button' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === '?'){ e.preventDefault(); showHelp(); return; }
  if (view === 'setup') return;
  unlockAudio();
  const k = e.key.toLowerCase();
  if (isDuel()){
    const i = k === 'z' ? 0 : k === 'm' ? 1 : -1;
    if (i >= 0){ e.preventDefault(); if (e.repeat) return; const t = S.teams[i]; if (t) buzz(t.id); return; }
  } else if (/^[0-9]$/.test(k)){
    e.preventDefault(); if (e.repeat) return;
    const t = S.teams[k === '0' ? 9 : +k - 1];
    if (t) buzz(t.id);
    return;
  }
  const map = {
    arrowright: goNext, n: goNext, arrowleft: goPrev, p: goPrev,
    ' ': toggleReveal, a: toggleReveal,
    t: ACT['timer-toggle'], b: ACT['buzz-toggle'],
    c: () => judge(true), w: () => judge(false),
    s: ACT.award, l: ACT['board-toggle'], u: undo, f: toggleFullscreen
  };
  const fn = map[k];
  if (fn){ e.preventDefault(); fn(); }
});

function toggleFullscreen(){
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) throw new Error('unsupported');
    const p = req.call(el);
    if (p && p.catch) p.catch(() => toast('Full screen is blocked here. Use your browser\u2019s own full screen (F11 on a PC).'));
  } catch (e) { toast('Full screen is blocked here. Use your browser\u2019s own full screen (F11 on a PC).'); }
}

/* Keep two windows (host + projector) in sync */
window.addEventListener('storage', e => {
  if (SCREEN || e.key !== KEY || !e.newValue) return;
  try { S = normalise(JSON.parse(e.newValue)); } catch (err) { return; }
  netSync();
  const ae = document.activeElement;
  if (view === 'setup' && ae && main.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ pendingRender = true; renderHeader(); return; }
  render();
});
main.addEventListener('focusout', () => {
  if (!pendingRender) return;
  setTimeout(() => {
    const ae = document.activeElement;
    if (pendingRender && !(ae && main.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) render();
  }, 0);
});

function addLibraryFiles(files){

  Promise.all(list.map(f => new Promise(res => { const rd = new FileReader(); rd.onload = () => res({ name: f.name, text: String(rd.result) }); rd.onerror = () => res({ name: f.name, text: '' }); rd.readAsText(f); })))
    .then(results => {
      const items = libItems(); let added = 0, updated = 0, builtIn = 0; const failed = [];
      const builtTitles = new Set(BUILTIN_QUIZZES.map(q => q.title));
      results.forEach(({ name, text }) => {
        try {
          const d = JSON.parse(text);
          const quiz = normaliseQuiz(d && d.quiz ? d.quiz : d);
          const n = quiz.rounds.reduce((k, r) => k + r.questions.length, 0);
          if (!n) throw new Error('empty');
          const title = quiz.title || name.replace(/\.json$/i, '');
          if (builtTitles.has(title)){ builtIn++; return; }
          const slim = { title, rounds: quiz.rounds.map(r => ({ name: r.name, info: r.info, type: r.type, mystery: r.mystery, clue: r.clue, mode: r.mode,
            questions: r.questions.map(q => ({ q: q.q, a: q.a, pts: q.pts, cat: q.cat, note: q.note, wrong: q.wrong })) })), tiebreakers: quiz.tiebreakers.map(t => ({ q: t.q, a: t.a, note: t.note })) };

      if (!added && !updated && builtIn && !failed.length){ toast('Those quizzes are already built in.'); render(); return; }
      if ((added || updated) && libStore(items)){
        toast(`${builtIn ? `${builtIn} already built in. ` : ''}${added ? `${added} ${added === 1 ? 'quiz' : 'quizzes'} added` : ''}${added && updated ? ', ' : ''}${updated ? updated + ' updated' : ''}${failed.length ? `. Couldn\u2019t read: ${failed.join(', ')}` : ''}`);

      render();
    });

function lev(a, b){

  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  const all = rounds().flatMap(rr => rr.questions.map(x => x.a)).filter(Boolean).concat(starterPool());
  pick(same.filter(shape));
  if (out.length < n) pick(all.filter(shape));
  if (out.length < n) pick(all);
  return out.slice(0, n);
}
function choicesFor(q){
  const io = inlineOpts(q);
  if (io) return { opts: io.opts, correct: io.correct };
  let wrong = (q.wrong || []).map(x => String(x).trim()).filter(Boolean).slice(0, 3);
  if (wrong.length < 3) wrong = wrong.concat(makeWrong(q, 3 - wrong.length, wrong));
  const rnd = seeded(q.id + '|' + q.a);
  const right = String(q.a || '').replace(/\s*\([^)]*\)/g, '').trim() || q.a;
  const order = [right].concat(wrong).map((o, i) => ({ o, i, k: rnd() })).sort((x, y) => x.k - y.k);
  return { opts: order.map(x => x.o), correct: order.findIndex(x => x.i === 0) };
}
function fillOptions(r, all){
  let n = 0;
  r.questions.forEach(q => {
    if (listAnswers(q) || inlineOpts(q)) return;
    const have = (q.wrong || []).filter(Boolean);
    if (all || have.length < 3){ q.wrong = (all ? [] : have).concat(makeWrong(q, all ? 3 : 3 - have.length, all ? [] : have)).slice(0, 3); n++; }
  });
  return n;
}

  else if (isTyped()){
    const lq = listAnswers(q);
    S.buzz.order.forEach(b => {
      if (b.st !== 'wait') return;
      if (lq){ b.hits = listHits(b.ans, lq); b.st = b.hits > 0 ? 'right' : 'wrong'; }
      else b.st = isMatch(b.ans, q.a) ? 'right' : 'wrong';

}

const tbNum = v => { const m = String(v == null ? '' : v).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };

  const t = S.quiz.tiebreakers[S.tb.i]; if (!t) return null;

    return { tm, g: g == null ? '' : g, diff: Number.isFinite(v) && Number.isFinite(target) ? Math.abs(v - target) : Infinity };
  });
