/* ---------- Importer: turns text copied from a quiz PDF into rounds ---------- */
function niceCase(s){
  s = String(s || '').trim();
  if (/[a-z]/.test(s)) return s;
  const small = new Set(['a','an','and','the','of','to','in','on','for','or','at','by','with']);
  return s.toLowerCase().split(/\s+/).map((w, i) => w.split('-').map((p, j) => {
    if ((i > 0 || j > 0) && small.has(p.replace(/[^a-z]/g, ''))) return p;
    return p.replace(/[a-z]/, c => c.toUpperCase());
  }).join('-')).join(' ');
}
const parenDepth = s => (String(s).match(/\(/g) || []).length - (String(s).match(/\)/g) || []).length;
function parseQuizText(raw){
  const src = String(raw || '').replace(/\r\n?/g, '\n').replace(/[\u00a0\u2009\u202f\f\t]/g, ' ');
  const empty = kind => ({ kind, title: '', rounds: [], tiebreakers: [], issues: [], count: 0 });
  if (!src.trim()) return empty('qa');
  if (!/ROUND\s+\d+\s*[–\-:]/i.test(src) && /HANDOUT SHEET|ANSWERS/i.test(src)) return empty('handout');
  let text = src
    .replace(/While every effort has been made to ensure the accuracy of this content note QuizDemon cannot be held responsible for any errors/gi, '\n')
    .replace(/QuizDemon Pub Quizzes/gi, '\n')
    .replace(/(QD\d+\s*(Christmas\s*)?)?©\s*QuizDemon/gi, '\n')
    .replace(/www\.quizdemon\.co\.uk/gi, '\n');
  let lines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(l => l && !/^(QuizDemon|Weekly Pub Quiz)$/i.test(l));
  if (lines.length < 12 && text.length > 400){
    text = text.replace(/\s(ROUND\s+\d+\s*[–-])/g, '\n$1').replace(/\s(TIE ?BREAKERS?:?)/gi, '\n$1')
      .replace(/\s(Re\s*Q?\d+\s*:)/g, '\n$1').replace(/\s(\d{1,2}\.\s)/g, '\n$1').replace(/\s(Initial letters of each answer spell)/gi, '\n$1');
    lines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  }
  return parseQA(lines);
}
function parseQA(lines){
  const out = { kind: 'qa', title: '', rounds: [], tiebreakers: [], issues: [], count: 0 };
  const NUM = /^(\d{1,2})(?:\s*(?:&|and|to|–|-)\s*(\d{1,2}))?\s*\.\s*(.*)$/i;
  const HEAD = /^ROUND\s+(\d+)\s*[–\-:]\s*(.+)$/i;
  const TB = /^TIE ?BREAKERS?\s*:?$/i;
  const TBQ = /^Re\s*:?\s*Q?\s*(\d+)\s*[:.]\s*(.*)$/i;
  const MYST = /^Initial letters of each answer,?\s*(?:in order,?\s*)?spells?\s*:\s*(.+)$/i;
  const TITLE = /^(.*?Quiz.*?)\s*[–-]?\s*Questions\s*(?:and|&)\s*Answers\s*(.*)$/i;
  const sections = [];
  let sec = null;
  for (const L of lines){
    let m;
    if (!out.title && (m = L.match(TITLE))){
      const extra = m[2].replace(/^[\s–-]+/, '').trim();
      out.title = m[1].replace(/[\s–-]+$/, '').trim() + (extra ? ' \u2013 ' + extra : '');
      continue;
    }
    if ((m = L.match(HEAD))){ sec = { tb: false, name: niceCase(m[2].replace(/\s+[–-]\s+/g, ' \u2013 ')), body: [] }; sections.push(sec); continue; }
    if (TB.test(L)){ sec = { tb: true, name: 'Tiebreakers', body: [] }; sections.push(sec); continue; }
    if (sec) sec.body.push(L);
  }
  let lastNum = 0;
  const qEnd = s => {
    const i = s.lastIndexOf('?'); if (i < 0) return null;
    const tail = s.slice(i + 1), quote = (tail.match(/^['’"”]+/) || [''])[0];
    return { q: s.slice(0, i + 1) + quote, rest: tail.slice(quote.length).trim() };
  };
  const endsQ = s => /\?['’"”]?\s*$/.test(s) || /\?['’"”]?\s*\([^)]*\)\s*$/.test(s);

  sections.forEach(sc => {
    const body = sc.body, qs = [], queue = [], info = [], clue = [];
    let cur = null, header = !sc.tb, clueMode = false, mystery = '', preA = [];
    const validNum = n => (n > lastNum && n <= lastNum + 3) || (lastNum === 0 && n === 1);
    const newQ = (num, span) => { cur = { num, span, q: [], a: [], qnote: [], ended: false, noteOpen: false, qnoteOpen: false }; qs.push(cur); return cur; };
    const takeNum = () => { if (queue.length) return queue.shift(); lastNum += 1; return { n: lastNum, span: 1 }; };
    const isMarker = s => { const m = s.match(NUM); return !!m && !sc.tb; };
    const looksQ = i => {
      const s0 = body[i];
      if ((s0.startsWith('(') && !queue.length) || MYST.test(s0)) return false;
      if (/\?\s+\S/.test(s0) && s0.length > 30) return true;
      if (s0.length < 30 && !endsQ(s0)) return false;
      for (let k = i; k < Math.min(body.length, i + 4); k++){
        const s = body[k];
        if (k > i && (isMarker(s) || TBQ.test(s) || s.startsWith('(') || MYST.test(s))) return false;
        if (endsQ(s)) return true;
      }
      return false;
    };
    const feedQ = (q, t) => {
      if (!q.q.length && /^the link\b/i.test(t)){ q.q.push(t); q.ended = true; return; }
      const e = endsQ(t) || /\?\s+\S/.test(t) ? qEnd(t) : null;
      if (!e){ q.q.push(t); return; }
      q.q.push(e.q); q.ended = true;
      if (e.rest){ if (e.rest.startsWith('(')) q.qnote.push(e.rest); else q.a.push({ t: e.rest }); }
    };
    for (let i = 0; i < body.length; i++){
      const L = body[i]; let m;
      if ((m = L.match(MYST))){ mystery = m[1].trim(); continue; }
      if (sc.tb && (m = L.match(TBQ))){ header = false; feedQ(newQ(0, 1), m[2] || ''); if (!m[2]) cur.q = []; continue; }
      if (!sc.tb && (m = L.match(NUM)) && validNum(+m[1])){
        header = false;
        const n = +m[1], n2 = m[2] ? Math.max(+m[2], n) : n;
        lastNum = n2;
        if (m[3]) feedQ(newQ(n, n2 - n + 1), m[3]);
        else queue.push({ n, span: n2 - n + 1 });
        continue;
      }
      if (header){
        if (/^Optional Clues?\s*:/i.test(L)){ clueMode = true; clue.push(L.replace(/^Optional Clues?\s*:\s*/i, '')); }
        else if (clueMode) clue.push(L); else info.push(L);
        continue;
      }
      if (cur && cur.qnoteOpen){ cur.qnote.push(L); cur.qnoteOpen = parenDepth(cur.qnote.join(' ')) > 0; continue; }
      if (cur && cur.noteOpen){ const last = cur.a[cur.a.length - 1]; last.t += ' ' + L; cur.noteOpen = parenDepth(last.t) > 0; continue; }
      if (L.startsWith('(')){
        if (queue.length && looksQ(i)){ const nm = takeNum(); feedQ(newQ(nm.n, nm.span), L); continue; }
        if (!cur) continue;
        if (!cur.ended){ feedQ(cur, L); continue; }
        let d = 0, close = -1;
        for (let k = 0; k < L.length; k++){ if (L[k] === '(') d++; else if (L[k] === ')'){ d--; if (d === 0){ close = k; break; } } }
        const after = close >= 0 ? L.slice(close + 1).trim() : '';
        const hasReal = cur.a.some(x => !x.note);
        if (!hasReal && after){ cur.a.push({ t: L }); continue; }
        if (!hasReal && !queue.length){ cur.qnote.push(L); cur.qnoteOpen = parenDepth(L) > 0; continue; }
        cur.a.push({ t: L, note: true }); cur.noteOpen = parenDepth(L) > 0;
        continue;
      }
      if (cur && !cur.ended){ feedQ(cur, L); continue; }
      const q0 = looksQ(i);
      const shortAnswer = cur && cur.ended && !cur.a.some(x => !x.note) && L.length < 45 && !queue.length;
      if (sc.tb){ if (cur) cur.a.push({ t: L, note: cur.a.some(x => !x.note) && L.length > 45 }); continue; }
      if ((q0 && !shortAnswer) || (queue.length && q0)){
        const nm = takeNum(); const nq = newQ(nm.n, nm.span);
        if (preA.length){ nq.a = preA.map(t => ({ t })); preA = []; }
        feedQ(nq, L); continue;
      }
      /* Some layouts print a short answer just above its question */
      if (queue.length && !q0){ preA.push(L); continue; }
      if (!cur) continue;
      const hasReal = cur.a.some(x => !x.note);
      cur.a.push({ t: L, note: hasReal && L.length > 45 && qs.filter(q => !q.a.length).length === 0 });
    }
    /* Table layouts list a run of answers after several questions: share them out in order */
    const realOf = q => q.a.filter(x => !x.note).length;
    const CONT_END = /\b(of|the|to|be|and|a|an|in|on|for|de)$/i;
    let pending = [];
    qs.forEach(q => {
      const real = realOf(q);
      if (real === 0 && q.ended){ pending.push(q); return; }
      if (real > (q.span || 1) && pending.length){
        const targets = pending.concat([q]);
        const need = targets.reduce((n, t) => n + (t.span || 1), 0);
        let block = q.a.slice();
        let reals = () => block.filter(x => !x.note).length;
        while (reals() > need){
          /* Join a wrapped answer: first where a line ends mid-phrase, otherwise the shortest joined pair */
          let idx = -1, bestLen = Infinity;
          for (let k = 0; k < block.length - 1; k++){
            if (block[k].note || block[k + 1].note) continue;
            if (CONT_END.test(block[k].t.trim()) || /^[a-z]/.test(block[k + 1].t)){ idx = k; break; }
            const len = block[k].t.length + block[k + 1].t.length - (/\s/.test(block[k + 1].t.trim()) ? 0 : 1000);
            if (len < bestLen){ bestLen = len; idx = k; }
          }
          if (idx < 0) break;
          block[idx] = { t: block[idx].t.trim() + ' ' + block[idx + 1].t.trim() };
          block.splice(idx + 1, 1);
        }
        targets.forEach(t => { t.a = []; });
        let ti = 0, used = 0;
        block.forEach(x => {
          if (!x.note){
            if (used >= (targets[ti].span || 1) && ti < targets.length - 1){ ti++; used = 0; }
            used++;
          }
          targets[ti].a.push(x);
        });
      }
      pending = [];
    });
    const items = qs.map(q => {
      if (!q.a.some(x => !x.note) && !q.ended && q.q.length > 1) q.a.unshift({ t: q.q.pop() });
      const real = q.a.filter(x => !x.note).map(x => x.t.trim());
      const notes = q.a.filter(x => x.note).map(x => x.t.trim().replace(/^\(([\s\S]*)\)$/, '$1'));
      let qt = q.q.join(' ').replace(/\s+/g, ' ').trim();
      if (q.qnote.length) qt += ' ' + q.qnote.join(' ').replace(/\s+/g, ' ');
      return { num: q.num, q: qt.trim(), a: real.join(' / ').replace(/\s+/g, ' '), note: notes.join(' ').replace(/\s+/g, ' '), pts: q.span || 1 };
    }).filter(x => x.q || x.a);
    if (sc.tb){ items.forEach(x => out.tiebreakers.push({ q: x.q, a: x.a, note: x.note })); return; }
    const infoText = info.join(' ').replace(/\s+/g, ' ').trim();
    const letters = /initial letters/i.test(infoText) || /link.?a.?letter/i.test(sc.name) || !!mystery;
    items.forEach(x => { if (!x.a) out.issues.push(`${sc.name}, question ${x.num}: no answer found`); if (!x.q) out.issues.push(`${sc.name}, question ${x.num}: no question text`); });
    if (letters && mystery && mystery.replace(/[^A-Za-z0-9]/g, '').length !== items.length) out.issues.push(`${sc.name}: the mystery answer doesn\u2019t match the number of questions`);
    out.rounds.push({ name: sc.name, info: infoText, type: letters ? 'letters' : 'standard', mystery: letters ? mystery.toUpperCase() : '', clue: clue.join(' ').replace(/\s+/g, ' ').trim(), questions: items });
  });
  out.rounds = out.rounds.filter(r => r.questions.length);
  out.count = out.rounds.reduce((n, r) => n + r.questions.length, 0);
  return out;
}
function importPreviewHTML(p){
  if (p.kind === 'handout') return `<div class="warn"><strong>This is a handout sheet.</strong> Its questions are pictures and puzzles, so they can\u2019t be played on screen or on phones and are left out. Paste the questions-and-answers sheet instead.</div>`;
  if (!p.count) return `<div class="warn">No questions found. Check you copied the whole PDF, including the round headings and question numbers.</div>`;
  const show = p.issues.slice(0, 6);
  return `<p style="margin-top:10px"><strong>${esc(p.title || 'Quiz')}</strong>: ${plural(p.rounds.length, 'round')}, ${plural(p.count, 'question')}${p.tiebreakers.length ? `, ${plural(p.tiebreakers.length, 'tiebreaker')}` : ''}.</p>
    <ul class="imp-list">${p.rounds.map(r => `<li>${esc(r.name)}: ${plural(r.questions.length, 'question')}${r.type === 'letters' ? ` (link-a-letter${r.mystery ? ', spells ' + esc(r.mystery) : ''})` : ''}</li>`).join('')}</ul>
    ${show.length ? `<div class="warn"><strong>Check after importing:</strong> ${show.map(esc).join('; ')}${p.issues.length > show.length ? `; plus ${p.issues.length - show.length} more` : ''}. You can fix these under Rounds and questions.</div>` : '<p class="hint">Everything was read cleanly.</p>'}`;
}
function applyImport(p, where, mode){
  const rs = p.rounds.map(r => Object.assign(makeRound(r.name, [], 1), {
    info: r.info.slice(0, 400), type: r.type, mystery: r.mystery.slice(0, 60), clue: r.clue.slice(0, 400), mode: ['choice', 'typed', 'buzz', 'written'].includes(mode) ? mode : 'typed',
    questions: r.questions.map(q => ({ id: uid(), q: q.q.slice(0, 600), a: q.a.slice(0, 300), pts: clamp(q.pts || 1, 1, 10), cat: r.name, note: q.note.slice(0, 400) }))
  }));
  const tbs = p.tiebreakers.map(t => ({ id: uid(), q: t.q.slice(0, 600), a: t.a.slice(0, 200), note: t.note.slice(0, 400) }));
  const done = () => {
    if (mode === 'choice') rs.forEach(r => fillOptions(r, false));
    commit();
    toast(`Imported ${plural(p.count, 'question')} in ${plural(rs.length, 'round')}${mode === 'choice' ? '. Check the wrong options in Setup.' : ''}`);
  };
  if (where === 'replace'){
    closeModal();
    ask('Replace your quiz?', 'Your current rounds, questions and tiebreakers will be deleted and scores reset.', 'Replace quiz', () => {
      S.quiz = { title: (p.title || S.quiz.title).slice(0, 80), rounds: rs, tiebreakers: tbs.slice(0, 10) };
      restartGame(); done();
    }, true);
    return;
  }
  keepCurrent(() => { rs.forEach(r => rounds().push(r)); });
  S.quiz.tiebreakers = S.quiz.tiebreakers.concat(tbs).slice(0, 10);
  closeModal(); done();
}
function openImport(){
  showModal(`<h2>Import a quiz from a PDF</h2>
    <ol class="howto-list">
      <li>Open the quiz PDF on this computer, for example in Chrome or Edge.</li>
      <li>Click on the PDF, press <span class="keycap">Ctrl</span> + <span class="keycap">A</span> to select everything, then <span class="keycap">Ctrl</span> + <span class="keycap">C</span> to copy. On a Mac, use <span class="keycap">Cmd</span>.</li>
      <li>Click in the box below and press <span class="keycap">Ctrl</span> + <span class="keycap">V</span> to paste.</li>
    </ol>
    <textarea id="impText" class="json" rows="7" spellcheck="false" placeholder="Paste the quiz text here"></textarea>
    <div class="row2">
      <label class="field">Put it<select id="impWhere"><option value="add">After the current rounds</option><option value="replace">Instead of the current quiz</option></select></label>
      <label class="field">${Noun(true)} answer by<select id="impMode">
        <option value="typed">Typing the answer on phones</option>
        <option value="choice">Multiple choice (wrong options made automatically)</option>
        <option value="buzz">Buzzers</option>
        <option value="written">Writing on paper</option></select></label>
    </div>
    <div id="impPreview" aria-live="polite"><p class="hint">Paste the text to see what will be imported.</p></div>
    <div class="modal-actions"><button class="btn" data-act="modal-close" type="button">Cancel</button><button class="btn primary" id="impGo" type="button" disabled>Import quiz</button></div>`);
  let parsed = null, t = null;
  const ta = $('#impText');
  const check = () => {
    parsed = ta.value.trim() ? parseQuizText(ta.value) : null;
    $('#impPreview').innerHTML = parsed ? importPreviewHTML(parsed) : '<p class="hint">Paste the text to see what will be imported.</p>';
    $('#impGo').disabled = !(parsed && parsed.count > 0);
  };
  ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(check, 250); });
  $('#impGo').addEventListener('click', () => { check(); if (parsed && parsed.count) applyImport(parsed, $('#impWhere').value, $('#impMode').value); });
}

/* Minimal MQTT 3.1.1 client over WebSocket (QoS 0 only), no dependencies */
/* Connection to this quiz's server. Same shape as the old MQTT client, so the rest of the app is unchanged.
   Status values: connecting, online, offline, refused (room code owned by another quiz), noserver. */
function mqttClient(_url, onMsg, onStatus){
  const subs = new Set();
  let claimArgs = null, phoneAuth = null, tvPair = null, closed = false, sock = null;
  let authorised = false, retryAuth = null, authEpoch = 0;
  const api = {
    online: false, onConnect: null, onPairLost: null, socket: null,
    subscribe(t){ subs.add(t); if (api.online) sock.emit('sub', { topic: t }); },
    unsubscribe(t){ subs.delete(t); if (api.online) sock.emit('unsub', { topic: t }); },
    publish(t, m, retain){ if (!api.online) return false; sock.emit('pub', { topic: t, msg: String(m), retain: !!retain }); return true; },
    claim(room, token){ claimArgs = { room, token }; if (sock?.connected) authenticate(); },
    bindPhone(room, cid, secret){ phoneAuth = { room, cid, secret }; if (sock?.connected) authenticate(); },
    assignPhone(room, cid, team, done){
      if (!api.online) { if (done) done(false); return; }
      // A deployment/disconnect can swallow an acknowledgement. Never leave the
      // quizmaster's Approve button stuck in a permanently pending state.
      let settled = false;
      const finish = ok => { if (settled) return; settled = true; clearTimeout(timeout); if (done) done(ok); };
      const timeout = setTimeout(() => finish(false), 6500);
      sock.emit('phone-assign', { room, cid, team }, r => finish(!!r?.ok));
    },
    pairTV(p){ tvPair = p; if (sock?.connected) authenticate(); },
    kick(){ if (sock && !closed && !sock.connected) sock.connect(); else if (sock?.connected && !api.online) authenticate(); },
    close(){ closed = true; clearTimeout(retryAuth); api.online = false; if (sock) sock.close(); }
  };
  function markReady(){
    if (closed || !sock?.connected) return;
    authorised = true; api.online = true;
    subs.forEach(t => sock.emit('sub', { topic: t }));
    onStatus('online');
    if (api.onConnect) api.onConnect();
  }
  function authenticate(){
    if (closed || !sock?.connected) return;
    clearTimeout(retryAuth);
    const epoch = ++authEpoch;
    authorised = false; api.online = false;
    const method = claimArgs ? 'claim' : phoneAuth ? 'phone-auth' : tvPair ? 'tv-resume' : null;
    const creds = claimArgs || phoneAuth || tvPair;
    if (!method){ markReady(); return; }
    sock.emit(method, creds, r => {
      if (closed || !sock?.connected || epoch !== authEpoch) return;
      if (r?.ok){ markReady(); return; }
      if (method === 'claim'){ onStatus('refused'); return; }
      if (method === 'tv-resume'){
        onStatus('unpaired');
        if (api.onPairLost) api.onPairLost();
        return;
      }
      onStatus('offline');
      // After a Render restart the host may not have reclaimed the room yet.
      // Retry phone registration without requiring the player to reload.
      retryAuth = setTimeout(authenticate, 2000);
    });
  }
  if (typeof io !== 'function'){ setTimeout(() => onStatus('noserver'), 0); return api; }
  sock = io('/quiz', { transports: ['websocket', 'polling'], reconnectionDelayMax: 4000 });
  api.socket = sock;
  setTimeout(() => { if (!api.online && !closed) onStatus('connecting'); }, 0);
  sock.on('connect', () => { onStatus('connecting'); authenticate(); });
  sock.on('disconnect', () => { clearTimeout(retryAuth); ++authEpoch; authorised = false; api.online = false; if (!closed) onStatus('offline'); });
  sock.on('connect_error', () => { api.online = false; if (!closed) onStatus('offline'); });
  sock.on('msg', d => { if (d && typeof d.topic === 'string') onMsg(d.topic, typeof d.msg === 'string' ? d.msg : ''); });
  return api;
}
function hostToken(){
  let t = ''; try { t = localStorage.getItem(HOST_TOKEN_KEY) || ''; } catch (e) {}
  if (!/^[A-Za-z0-9]{24,64}$/.test(t)){
    const a = new Uint32Array(8); crypto.getRandomValues(a);
    t = Array.from(a, v => v.toString(36)).join('').replace(/[^a-z0-9]/gi, '').slice(0, 40).padEnd(24, '0');
    try { localStorage.setItem(HOST_TOKEN_KEY, t); } catch (e) {}
  }
  return t;
}
function newKey(){
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, v => ROOM_CHARS[v % ROOM_CHARS.length]).join('');
}
/* The secret part of the TV screen's channel, so phones can never read answers early */
function screenKey(){
  if (!/^[A-Za-z0-9]{6,32}$/.test(S.net.key || '')){
    S.net.key = newKey();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  return S.net.key;
}
function tvAddress(){ return (SERVER_BASE || location.origin).replace(/^https?:\/\//, '') + '/tv'; }

/* Minimal QR code encoder: byte mode, error correction M, versions 1-10 */
function qrMatrix(text){
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];

  const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2){ const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCap = v => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];
  let ver = 1;
  for (; ver <= 10; ver++) if (4 + (ver < 10 ? 8 : 16) + data.length * 8 <= dataCap(ver) * 8) break;
  if (ver > 10) return null;
  const bits = [];
  const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
  put(0, Math.min(4, dataCap(ver) * 8 - bits.length));
  put(0, (8 - bits.length % 8) % 8);

  for (let i = 0; i < bits.length; i += 8){ let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }
  for (let pad = 0xEC; cw.length < dataCap(ver); pad ^= 0xEC ^ 0x11) cw.push(pad);
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const deg = ECC[ver];
  const div = new Array(deg - 1).fill(0).concat([1]);

  for (let i = 0; i < deg; i++){
    for (let j = 0; j < div.length; j++){ div[j] = mul(div[j], root); if (j + 1 < div.length) div[j] ^= div[j + 1]; }

function rejectJoin(cid){

/* Joining a team is an asynchronous server assignment. Reserve the approval until

function finishPhoneJoin(cid, tid, ph, reply, draftTeam){
  const client = NET.client, room = S.net.room;
  if (!client || !client.online) return reply({k:'nojoin',why:'Host connection interrupted. Please retry.'});
  if (NET.approving.has(cid)) return;
  const request = NET.joinRequests.get(cid);
  const oldTeam = ph.team;
  NET.approving.add(cid);
  softRender();
  client.assignPhone(room, cid, tid, ok => {
    // A new room / host connection must never mutate this quiz or respond to its phones.
    if (NET.client !== client || S.net.room !== room) return;
    NET.approving.delete(cid);
    // A user may cancel or be rejected while an approval is in flight.
    if (request && NET.joinRequests.get(cid) !== request){
      if (ok) client.assignPhone(room,cid,oldTeam || null,()=>{});
      softRender();
      return;
    }
    if (!ok){
      // The relay may have accepted the binding but its acknowledgement was lost.
      // Restore the previous team where possible before the player retries.
      if (client.online) client.assignPhone(room,cid,oldTeam || null,()=>{});
      NET.joinRequests.delete(cid);
      reply({k:'nojoin',why:'Phone session could not be paired. Reconnect and try again.'});
      softRender();
      return;
    }
    // Only commit new-team creation after the server has confirmed the phone binding.
    if (draftTeam && !S.teams.some(t => t.id === draftTeam.id)){
      S.teams.push(draftTeam);
      toast(`${draftTeam.name} approved as a new team`);
    }
    NET.joinRequests.delete(cid);
    ph.team = tid;
    if (S.lobby && !S.ready.includes(tid)){ S.ready.push(tid); beep(600 + S.ready.length * 70, 0.16); }

}
function approveJoin(cid){
  const x = NET.joinRequests.get(cid); if (!x || NET.approving.has(cid)) return;
  if (Date.now()-x.at > 120000){ rejectJoin(cid); return; }
  const ph = NET.phones.get(cid); if (!ph){ NET.joinRequests.delete(cid); softRender(); return; }
  let tid = x.team, draft = null;
  if (tid && !team(tid)){ rejectJoin(cid); return; }

    const existing = S.teams.find(t => t.name.toLowerCase() === x.name.toLowerCase());
    if (existing) tid = existing.id;
    else {
      // Serialise new-team creation so two approvals cannot exceed the team limit
      // or create duplicates with the same requested name while a relay ack is late.
      const newTeamInFlight = [...NET.approving].some(id => {

    if (S.net.requireApproval){
      for (const [id, request] of NET.joinRequests) if (Date.now() - request.at > 120000) NET.joinRequests.delete(id);
      const old=NET.joinRequests.get(m.cid);
      if (!old || old.team !== tid || old.name !== (tid?null:requestedName)){
        if (NET.joinRequests.size >= 40){ reply({k:'nojoin',why:'Too many requests. Ask the quizmaster to clear the queue.'}); return; }

    buzz(m.team,Number(m.te),typeof m.ans === 'number' || typeof m.ans === 'string' ? m.ans : undefined);
  }
}

function joinPanelHTML(){

/* ---------- Phone side: the buzzer app ---------- */
function runPhone(){
  const hp = new URLSearchParams(location.hash.slice(1));
  const room = (hp.get('buzz') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  const broker = clamp(parseInt(hp.get('b'), 10) || 0, 0, BROKERS.length - 1);
  document.documentElement.style.height = '100%';
  document.body.className = 'phone';
  document.body.innerHTML = '<main id="phone" class="phone-app"></main><div id="phToast" class="toast" role="status" aria-live="polite"></div>';
  document.title = 'Buzzer | Pub Quiz Powerhouse';
  const root = document.getElementById('phone');
  let tt = null;
  const say = m => { const el = document.getElementById('phToast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2400); };
  const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  const msg = (h, p, extra) => `<div class="ph-msg"><h1>${h}</h1><p>${p}</p>${extra || ''}</div>`;
  const ordinal = n => { const sfx = ['th','st','nd','rd'], v = n % 100; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };

  if (!/^[A-Z0-9]{4,8}$/.test(room)){
    root.innerHTML = msg('Join a quiz', 'Type the room code shown on the big screen.',
      `<label class="field">Room code<input id="phRoom" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"></label><button class="btn primary big" id="phGo" type="button">Join quiz</button>`);
    const go = () => {
      const v = document.getElementById('phRoom').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length < 4){ say('Check the room code and try again.'); return; }
      location.hash = 'buzz=' + v; location.reload();
    };
    document.getElementById('phGo').addEventListener('click', go);
    document.getElementById('phRoom').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }

  const PKEY = 'pqp.phone.' + room;
  let mem = {}; try { mem = JSON.parse(localStorage.getItem(PKEY) || '{}') || {}; } catch (e) { mem = {}; }
  if (typeof mem.cid !== 'string' || !/^[a-z0-9]{3,40}$/i.test(mem.cid)) mem.cid = 'p' + uid();
  // This secret lives only on this phone. Its public team/room code is not credentials.
  if (typeof mem.secret !== 'string' || !/^[a-f0-9]{64}$/.test(mem.secret))
    mem.secret = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2, '0')).join('');
  const keep = () => { try { localStorage.setItem(PKEY, JSON.stringify(mem)); } catch (e) {} };
  keep();
  const cid = mem.cid;
  const P = { net: 'connecting', st: null, team: typeof mem.team === 'string' ? mem.team : null, choosing: false, pending: false, n: null, err: '', offs: [], joining: false, waiting: null };
  const base = NET_PREFIX + room + '/';

  let lock = null;
  const wake = async () => {
    try { if (!lock && 'wakeLock' in navigator && document.visibilityState === 'visible'){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  };

  function onMsg(topic, raw){
    if (!raw) return;
    let m; try { m = JSON.parse(raw); } catch (e) { return; }
    if (!m || typeof m !== 'object') return;
    if (topic === base + 'state'){
      if (m.phase === 'closed'){ P.st = null; P.err = 'closed'; draw(); return; }
      if (!Array.isArray(m.teams) || !Array.isArray(m.order)) return;
      P.st = m; P.err = '';
      if (P.team && !m.teams.some(t => t.id === P.team)){ P.team = null; mem.team = null; keep(); }
      if (m.n !== P.n){ P.n = m.n; P.pending = false; P.my = null; }
      if (P.pending && m.order.some(o => o.id === P.team)) P.pending = false;

    }
    if (m.k === 'pong' && Number.isFinite(m.t0) && Number.isFinite(m.th)){

    if (m.k === 'joined' && typeof m.team === 'string'){ P.waiting=null; P.team = m.team; mem.team = m.team; keep(); P.choosing = false; P.joining = false; vib(40); draw(); return; }
    if (m.k === 'pending'){ P.joining=false; P.waiting={team:m.team||null,name:m.name||null}; draw(); return; }
    if (m.k === 'cancelled'){ P.waiting=null; P.joining=false; draw(); return; }

  const ping = () => send({ k: 'ping', t0: Date.now(), team: P.team || undefined });
  cl.subscribe(base + 'state');
  cl.subscribe(base + 'out/' + cid);
  cl.onConnect = () => { ping(); setTimeout(ping, 500); setTimeout(ping, 1200); if (P.waiting) send(Object.assign({k:'join'},P.waiting)); else if (P.team) send({k:'join',team:P.team}); };
  setInterval(ping, 8000);
  setInterval(() => { if (P.waiting && P.net === 'online') send(Object.assign({k:'join'},P.waiting)); }, 12000);
  setTimeout(() => { if (!P.st && !P.err){ P.err = 'notfound'; draw(); } }, 10000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ cl.kick(); wake(); } });

  function teamVars(t){ const c = t && isHex(t.c) ? t.c : '#555555'; return `--c:${c};--ci:${inkFor(c)}`; }
  function phoneAvatarState(t){
    const state = P.st;
    if (!state || !t) return 'idle';
    if (state.phase === 'end' && Array.isArray(state.winners) && state.winners.includes(t.id)) return 'win';
    const fx = state.avatarFx && state.avatarFx[t.id];
    return fx && fx.until > Date.now() + offset() && ['correct','wrong'].includes(fx.st) ? fx.st : 'idle';

  function phoneAvatar(t){
    const state=phoneAvatarState(t), av=avatarId(t && t.av);
    return `<img class="team-avatar phone-avatar avatar-state-${state}" data-team-id="${esc(t && t.id || '')}" data-avatar-id="${av}" data-avatar-state="${state}" src="${avatarSrc(av,state)}" alt="" draggable="false">`;
  }
  setInterval(() => {
    document.querySelectorAll('img.phone-avatar[data-team-id]').forEach(img => {
      const state = phoneAvatarState({id:img.dataset.teamId});
      if (img.dataset.avatarState === state) return;
      img.dataset.avatarState=state; img.src=avatarSrc(img.dataset.avatarId,state);
      img.classList.remove('avatar-state-idle','avatar-state-correct','avatar-state-wrong','avatar-state-win');
      img.classList.add('avatar-state-'+state);
    });
  }, 350);
  function chooseHTML(s){
    if (P.waiting) return `<header class="ph-top"><span class="ph-title"><img class="ph-brand-icon" src="/assets/brand/compact-crest.webp" alt="" width="380" height="380" decoding="async"> QUIZ NIGHT LIVE</span><span>Room ${room}</span></header>
      <section class="ph-await" role="status"><h2>Waiting for quizmaster approval</h2>
        <p>Your request to join <strong>${esc(P.waiting.name || (s.teams.find(t => t.id === P.waiting.team)||{}).name || 'the quiz')}</strong> has been sent.</p>
        <p>The quizmaster can approve or reject it. Keep this page open.</p>
        <button class="btn" type="button" data-ph="cancel">Cancel request</button></section>`;
    const duel = s.mode === 'duel';
    return `<header class="ph-top"><span class="ph-title"><img class="ph-brand-icon" src="/assets/brand/compact-crest.webp" alt="" width="380" height="380" decoding="async"> QUIZ NIGHT LIVE <small>${esc(s.title)}</small></span><span class="muted">Room ${room}</span></header>
      ${P.net !== 'online' ? '<p class="ph-warn">Reconnecting\u2026</p>' : ''}
      <h1 class="ph-h">${duel ? 'Which player are you?' : 'Which team are you on?'}</h1>
      ${s.requireApproval ? '<p class="ph-status">The quizmaster will approve your request before you can play.</p>' : ''}
      <div class="ph-teams">${s.teams.map(t => `<button class="ph-team" style="${teamVars(t)}" data-ph="pick" data-id="${esc(t.id)}" type="button">${phoneAvatar(t)}<span>${esc(t.name)}</span></button>`).join('') || '<p class="muted">No teams yet.</p>'}</div>
      ${s.allowNew ? `<div><label class="field">Or start a new team<input id="phName" maxlength="40" placeholder="Team name" autocomplete="off"></label>
        <button class="btn primary big" data-ph="create" type="button" style="width:100%">Join as a new team</button></div>` : ''}
      ${P.team ? '<button class="btn" data-ph="back" type="button">Back to my buzzer</button>' : ''}`;
  }
  function buzzHTML(s){
    const me = s.teams.find(t => t.id === P.team) || {};
    const idx = s.order.findIndex(o => o.id === P.team), mine = s.order[idx];
    const aw = s.aw && typeof s.aw === 'object' ? s.aw : {};
    const gain = Number(aw[P.team]) || 0, anyAward = Object.keys(aw).length > 0;
    let label = 'Wait', status = '', can = false, cls = '';
    if (s.phase === 'lobby'){
      const ready = Array.isArray(s.ready) && s.ready.includes(P.team);
      can = true; label = ready ? 'Ready' : 'Check in';
      status = ready ? 'You\u2019re checked in. Waiting for the host to start.' : 'Tap the button to check in.';
    } else if (s.phase === 'between') status = `End of ${esc(s.rn)}. The leaderboard is on the big screen.`;
    else if (s.phase === 'end') status = 'That\u2019s the quiz! Final scores are on the big screen.';
    else if (gain){ label = '+' + gain; cls = 'win'; status = s.exclusive ? 'Winning buzzer! Points awarded.' : s.lst ? `You got ${gain} right!` : s.experience === 'show' ? (gain >= 3 ? 'Fastest correct answer!' : gain === 2 ? 'Second fastest correct answer!' : 'Correct!') : s.scoring === 'speed' && s.experience === 'legacy' ? (gain === 2 ? 'Fastest correct answer!' : 'Second fastest correct answer!') : 'Correct!'; }
    else if (s.exclusive && s.lockedBy && s.lockedBy !== P.team){

      else { label='Locked'; status=`${esc((s.teams.find(t=>t.id===s.lockedBy)||{}).name || 'Another team')} is answering. Wait for the host.`; }
    }
    else if (mine){
      label = s.exclusive ? (mine.st === 'wrong' ? 'Out' : 'Your turn') : ordinal(idx + 1);
      status = mine.st === 'right' ? (anyAward ? (s.experience === 'classic' ? 'Correct!' : 'Correct!') : 'Correct!') : mine.st === 'wrong' ? 'Not this time.' : (s.am === 'choice' || s.am === 'typed') ? s.experience === 'classic' && s.open ? 'Answer received. You can change it until the host closes answers.' : `Locked in ${ordinal(idx + 1)}. Wait for the reveal.` : s.exclusive ? 'Your buzzer won the turn! Tell the quizmaster your answer now.' : `Locked in ${ordinal(idx + 1)}. Tell the host your answer.`;
    }
    else if (s.w){ label = 'Write'; status = 'This round is written. Put your answer on your team\u2019s sheet.'; }
    else if (P.pending){ label = 'Sent'; status = 'Sending your buzz\u2026'; }
    else if (s.open){ can = true; label = 'Buzz!'; status = s.exclusive ? 'First buzz claims the turn. A wrong answer lets another team try.' : s.am === 'choice' ? (s.experience === 'classic' ? 'Choose your answer. You can change it until close.' : 'Tap your answer. Fastest correct earns a bonus!') : s.am === 'typed' ? (s.experience === 'classic' ? 'Type your answer. You can revise it until close.' : 'Type your answer. Faster correct answers earn bonuses!') : 'Buzzers are open. Tap fast!'; }
    else status = anyAward ? 'Points awarded. Wait for the next question.' : 'Wait for the next question.';
    let main = `<button class="ph-buzz ${can ? '' : 'off'} ${cls}" style="${teamVars(me)}" data-ph="buzz" type="button" ${can ? '' : 'aria-disabled="true"'}>${label}</button>`;
    if (s.phase === 'q' && (s.am === 'choice' || s.am === 'typed')){
      const myAns = mine && mine.ans !== undefined ? mine.ans : (P.my && P.my.n === s.n ? P.my.ans : null);
      const canAnswer = s.open && (s.experience === 'classic' || !mine) && !P.pending;
      if (s.am === 'choice'){
        const ch = Array.isArray(s.ch) ? s.ch.slice(0, 4) : [];
        main = `<div class="ph-opts">${ch.map((o, i) => {
          const picked = myAns !== null && Number(myAns) === i;
          const c = s.ci >= 0 ? (i === s.ci ? 'right' : picked ? 'wrong' : 'dim') : picked ? 'picked' : canAnswer ? '' : 'dim';
          return `<button class="ph-opt ${c}" data-ph="choose" data-c="${i}" type="button" ${canAnswer ? '' : 'aria-disabled="true"'}><span class="opt-l">${'ABCD'[i]}</span>${esc(String(o))}</button>`;
        }).join('')}</div>`;
      } else if (canAnswer){
        main = `<div class="ph-type"><input id="phAns" maxlength="160" placeholder="${s.lst ? `Type up to ${s.lst} answers, separated by commas` : 'Type your answer'}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Your answer">
          <button class="btn primary big" data-ph="send" type="button">Send answer</button></div>`;
      } else {
        main = `<div class="ph-sent">${myAns !== null ? 'Your answer: ' + esc(String(myAns)) : (s.open ? 'Sending\u2026' : 'No answer sent')}</div>`;
      }
    }
    const q = s.phase === 'q' && s.q
      ? `<div class="ph-q"><span class="ph-qn">${esc(s.rn)}, ${esc(s.qn)}</span><p>${esc(s.q)}</p>${s.a ? `<p class="ph-a">Answer: ${esc(s.a)}</p>` : ''}</div>`
      : '<div class="ph-q"></div>';
    return `<header class="ph-top"><button class="ph-chip" style="${teamVars(me)}" data-ph="change" type="button" aria-label="Change team, currently ${esc(me.name)}">${phoneAvatar(me)}<span>${esc(me.name)}</span><span class="ph-change" aria-hidden="true">⌄</span></button><span class="ph-score">${plural(Number(me.s) || 0, 'pt')}</span></header>
      ${P.net !== 'online' ? '<p class="ph-warn">Reconnecting\u2026 your buzz may not send.</p>' : ''}
      ${q}
      ${main}
      <p class="ph-status" aria-live="polite">${status}</p>
      <footer class="ph-foot"><span>Room ${room}</span><span>${esc(s.title)}</span></footer>`;
  }
  function draw(){
    const s = P.st;
    const prev = document.getElementById('phName') || document.getElementById('phAns');
    const prevId = prev ? prev.id : '', keepVal = prev ? prev.value : null, hadFocus = !!prev && document.activeElement === prev;
    let html;
    if (P.err === 'closed') html = msg('Phone buzzing has ended', 'The host has switched phone buzzers off. Thanks for playing!');
    else if (!s){
      if (P.net !== 'online') html = msg('Connecting\u2026', P.net === 'connecting' ? `Joining room ${room}.` : 'Still trying. Check this phone has Wi-Fi or mobile data.');
      else if (P.err === 'notfound') html = msg('Quiz not found', `No quiz is running with room code ${room}. Check the code with your host and scan the QR code again.`);
      else html = msg('Finding your quiz\u2026', `Room ${room}`);
    } else if (!P.team || P.choosing) html = chooseHTML(s);
    else html = buzzHTML(s);
    root.innerHTML = html;
    if (keepVal !== null){ const n = document.getElementById(prevId); if (n){ n.value = keepVal; if (hadFocus) n.focus(); } }
  }
  function doBuzz(){
    wake();
    const s = P.st; if (!s || !P.team) return;
    if (P.net !== 'online'){ say('No connection. Reconnecting\u2026'); cl.kick(); return; }
    if (s.phase === 'lobby'){ send({ k: 'buzz', team: P.team, n: s.n, te: Math.round(Date.now() + offset()) }); vib(30); return; }
    if (s.phase !== 'q' || !s.open || P.pending || s.order.some(o => o.id === P.team) || (s.exclusive && s.lockedBy)) return;
    P.pending = true;
    send({ k: 'buzz', team: P.team, n: s.n, te: Math.round(Date.now() + offset()) });

  }
  function doAnswer(ans){
    wake();
    const s = P.st; if (!s || !P.team) return;
    if (P.net !== 'online'){ say('No connection. Reconnecting\u2026'); cl.kick(); return; }
    if (s.phase !== 'q' || !s.open || P.pending || (s.experience !== 'classic' && s.order.some(o => o.id === P.team))) return;
    if (s.am === 'typed'){ ans = String(ans || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!ans){ say('Type an answer first.'); return; } }
    P.pending = true; P.my = { n: s.n, ans };
    send({ k: 'buzz', team: P.team, n: s.n, te: Math.round(Date.now() + offset()), ans });
    vib(90); draw();
    setTimeout(() => { if (P.pending){ P.pending = false; draw(); } }, 5000);
  }
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'phAns'){ e.preventDefault(); doAnswer(e.target.value); } });
  const joinTimeout = () => setTimeout(() => { if (P.joining){ P.joining = false; say('No reply from the quiz. Try again.'); } }, 6000);
  /* pointerdown fires as the finger lands, which is faster and fairer than click */
  root.addEventListener('pointerdown', e => {
    const c = e.target.closest('[data-ph="choose"]');
    if (c){ e.preventDefault(); doAnswer(Number(c.dataset.c)); return; }

  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-ph]'); if (!b) return;
    const a = b.dataset.ph;
    wake();
    if (a === 'cancel'){ send({k:'cancel'}); P.waiting=null; P.joining=false; draw(); return; }
    if (a === 'buzz'){ if (e.detail === 0) doBuzz(); return; }
    if (a === 'choose'){ if (e.detail === 0) doAnswer(Number(b.dataset.c)); return; }
    if (a === 'send'){ const inp = document.getElementById('phAns'); doAnswer(inp ? inp.value : ''); return; }
    if (a === 'pick'){ if (P.joining) return; P.joining = true; send({ k: 'join', team: b.dataset.id }); say('Joining\u2026'); joinTimeout(); }
    else if (a === 'create'){
      const v = (document.getElementById('phName').value || '').trim();
      if (!v){ say('Type a team name first.'); return; }
      if (P.joining) return;
      P.joining = true; send({ k: 'join', name: v.slice(0, 40) }); say('Joining\u2026'); joinTimeout();
    }
    else if (a === 'change'){ P.choosing = true; draw(); }
    else if (a === 'back'){ P.choosing = false; draw(); }
  });
  draw();
}

/* ---------- TV screen: a display-only Player screen driven by the quizmaster's device ---------- */
function screenSounds(a, b){
  if (!a || !b.settings.sound) return;
  if (b.finished && !a.finished){ fanfare(); return; }
  if (b.lobby && b.ready.length > a.ready.length){ playCue('join',.28); return; }
  if (b.buzz.n === a.buzz.n && b.buzz.order.length > a.buzz.order.length){
    const first = a.buzz.order.length === 0;
    playCue('buzz', first ? .54 : .3); return;
  }
  if (b.revealed && !a.revealed){
    const marked=b.buzz.order;
    playCue(marked.some(x=>x.st==='right')?'correct':'wrong',.38); return;
  }
  const recent=Object.entries(b.avatarFx || {}).filter(([id,fx]) => fx && (!a.avatarFx || !a.avatarFx[id] || a.avatarFx[id].until !== fx.until));
  if (recent.length && !(b.finished && !a.finished)) { playCue(recent.some(([,fx])=>fx.st==='correct')?'correct':'wrong',.36); return; }
  if (b.buzz.awarded && !a.buzz.awarded) playCue('gain',.45);
}
function startScreen(){
  document.documentElement.classList.add('is-screen');
  const SK = 'pqp.screen';
  const valid = p => !!p && /^[A-Z0-9]{4,8}$/.test(p.room || '') && /^[A-Za-z0-9]{6,32}$/.test(p.key || '');
  let pair = null; try { pair = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) {}
  if (!valid(pair)) pair = null;
  let code = '', topic = '', live = false, status = 'connecting', prev = null, closed = false;
  const cl = mqttClient('', onScreenMsg, st => {
    status = st;
    if (st === 'online' && !pair) requestCode();
    if (!live) paint();
  });
  function requestCode(){
    if (!cl.socket) return;
    cl.socket.emit('pair-request', {}, r => { if (r && r.ok){ code = r.code; if (!live) paint(); } });
  }
  function follow(p){
    if (topic) cl.unsubscribe(topic);
    pair = p; live = false; SCREEN_LIVE = false; prev = null; closed = false;
    try { localStorage.setItem(SK, JSON.stringify(p)); } catch (e) {}
    topic = NET_PREFIX + p.room + '/screen/' + p.key;
    cl.pairTV(p);
    cl.subscribe(topic);
    paint();
  }
  function forget(){
    if (topic) cl.unsubscribe(topic);
    topic = ''; pair = null; live = false; SCREEN_LIVE = false; prev = null; code = '';
    cl.pairTV(null);
    try { localStorage.removeItem(SK); } catch (e) {}
    S = freshState(); requestCode(); paint();
  }
  ACT['screen-forget'] = () => ask('Show a different quiz?', 'This TV stops following the current quiz and shows a new code to type in.', 'Get a new code', forget);
  if (cl.socket) cl.socket.on('paired', p => { if (valid(p)){ unlockAudio(); follow(p); } });
  cl.onPairLost = () => {
    // A restarted server has lost its in-memory pairing grants; ask for a new code.
    if (pair){
      if (topic) cl.unsubscribe(topic);
      pair = null; topic = ''; live = false; SCREEN_LIVE = false; prev = null;
      cl.pairTV(null);
      try { localStorage.removeItem(SK); } catch (e) {}
      requestCode(); paint();
    }
  };
  if (pair) follow(pair);
  /* the TV's few buttons appear only when the remote or mouse is used */
  let toolsT = null;
  const showTools = () => { document.documentElement.classList.add('show-tools'); clearTimeout(toolsT); toolsT = setTimeout(() => document.documentElement.classList.remove('show-tools'), 5000); };
  ['keydown', 'mousemove', 'pointerdown'].forEach(ev => document.addEventListener(ev, showTools, { passive: true }));
  function onScreenMsg(t, raw){
    if (t !== topic || !raw) return;
    let m; try { m = JSON.parse(raw); } catch (e) { return; }
    if (!m || m.v !== 1) return;
    if (m.closed){ live = false; SCREEN_LIVE = false; closed = true; prev = null; S = freshState(); paint(); return; }
    if (!m.s || typeof m.s !== 'object') return;
    const next = normalise(m.s);
    /* the quizmaster's clock may differ from the TV's: shift the countdown onto this clock */
    const skew = (Number(m.ts) || Date.now()) - Date.now();
    if (next.timer.running) next.timer.end -= skew;
    Object.values(next.avatarFx || {}).forEach(fx => { fx.until -= skew; });
    screenSounds(prev, next);
    S = next; prev = next; live = true; SCREEN_LIVE = true;
    render();
  }
  function paint(){
    if (live) return;
    renderHeader();
    $('#hIndicator').textContent = 'TV screen';
    const offline = status === 'offline' || status === 'noserver';
    let body;
    if (offline){
      body = `<h2 class="stage-title">Reconnecting\u2026</h2><p class="stage-sub">This screen can\u2019t reach the quiz server. Check the TV\u2019s internet or Wi-Fi connection. It keeps trying by itself.</p>`;
    } else if (pair && !closed){
      body = `<h2 class="stage-title">Waiting for the quizmaster</h2>
        <p class="stage-sub">This screen is connected to room ${esc(pair.room)}. The quiz appears here as soon as the quizmaster\u2019s device is online.</p>
        <button class="btn" data-act="screen-forget" type="button">Show a different quiz</button>`;
    } else {
      const digits = (code || '\u00b7\u00b7\u00b7\u00b7').split('').map(d => `<span>${esc(d)}</span>`).join('');
      body = `<h2 class="stage-title">${closed ? 'That quiz has finished' : 'Connect this screen'}</h2>
        <div class="screen-code" aria-label="Pairing code ${esc(code)}">${digits}</div>
        <ol class="screen-steps">
          <li>On the quizmaster\u2019s device, open <strong>Setup</strong> and choose <strong>From their phones</strong> in step 2.</li>
          <li>Under <strong>Show the quiz on a smart TV</strong>, type the code above and press <strong>Connect TV</strong>.</li>
        </ol>
        <p class="screen-note">Press OK on the remote once to turn on sound. Press F for full screen.</p>`;
    }
    main.innerHTML = `<section class="screen-wait"><div class="inner">${body}</div></section>`;
  }
  paint();
  setInterval(() => { if (!live && !pair && status === 'online') requestCode(); }, 10 * 60 * 1000);
}

/* Ask the server which address phones and TVs should use */
function loadServerBase(){
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('/api/base', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (j && typeof j.base === 'string' && /^https?:\/\//.test(j.base)){ SERVER_BASE = j.base; softRender(); }
  }).catch(() => {});
}

/* ---------- Start ---------- */
loadServerBase();
setInterval(refreshVisibleAvatars,350);
if (SCREEN){
  startScreen();
} else {
clampPos();
save();
render();
leaderTick();
setInterval(leaderTick, 1500);
setInterval(() => publishState(true), 15000);
setInterval(() => { if (S.net.on && NET.leader && view !== 'setup') paintNet(); }, 5000);
}
window.addEventListener('pagehide', () => {
  try { const cur = JSON.parse(localStorage.getItem(LEADER_KEY) || 'null'); if (cur && cur.id === WIN_ID) localStorage.removeItem(LEADER_KEY); } catch (e) {}
});
})();
</script>
</body>
</html>
