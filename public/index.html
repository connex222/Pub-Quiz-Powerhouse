<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1b16">
<title>Pub Quiz Powerhouse</title>
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Pub Quiz Powerhouse">
<meta property="og:description" content="Your quiz night, your rules. Classic Pub Quiz and TV Game Show experiences.">
<meta property="og:image" content="https://pub-quiz-powerhouse.onrender.com/assets/brand/header-wordmark.webp">
<meta name="twitter:card" content="summary_large_image">
<style>
/* =====================================================================
   Pub Quiz Powerhouse — "The Snug"
   Bottle-green panelling, brass fittings, gilded sign-writing.
   Fraunces for display (bundled), Atkinson Hyperlegible for everything
   people must read fast, at a distance, in sunlight or in a dark room.
   ===================================================================== */
@font-face{font-family:"Fraunces";src:url(/fonts/fraunces.woff2) format("woff2-variations"),url(/fonts/fraunces.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Fraunces";src:url(/fonts/fraunces-italic.woff2) format("woff2-variations"),url(/fonts/fraunces-italic.woff2) format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(/fonts/atkinson-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(/fonts/atkinson-700.woff2) format("woff2");font-weight:700 900;font-style:normal;font-display:swap}

:root{
  color-scheme: dark;
  /* The Snug (dark, default) */
  --bg:#10241e;           /* bottle green panelling */
  --bg-deep:#0a1814;
  --surface:#15302a;
  --surface-2:#1b3a32;
  --surface-3:#22473d;
  --ink:#f2ead6;          /* ivory */
  --ink-2:#bdb7a3;
  --line:#2c4b41;
  --rule:#7d6a3c;         /* brass hairline */
  --brass:#c9a24d;
  --brass-hi:#efd690;
  --brass-lo:#7a5c1c;
  --on-brass:#1e1605;
  --ok:#3aa56c; --on-ok:#06170e;
  --bad:#c4544a; --on-bad:#ffffff;
  --gilt:#efd690;         /* sign-writing colour for the big question */
  --gilt-shadow:0 1px 0 #7a5c1c,0 2px 0 #4d3a10,0 8px 22px rgba(0,0,0,.45);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.28);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  /* legacy names still used by markup */
  --teal-strong:var(--brass); --on-teal-strong:var(--on-brass); --teal-soft:var(--surface-2);
  --sage-strong:var(--surface-3); --on-sage-strong:var(--ink); --sage-line:var(--line);
  --gold:var(--brass); --on-gold:var(--on-brass);
}
/* Daylight (light) */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e6ebe4; --bg-deep:#d9e0d8; --surface:#fbfcf8; --surface-2:#f0f3ec; --surface-3:#e2e9e0;
    --ink:#10241e; --ink-2:#4b5c54; --line:#c6d0c4; --rule:#a98a45;
    --brass:#94701f; --brass-hi:#b48a2c; --brass-lo:#5e4610; --on-brass:#ffffff;
    --ok:#1d7a48; --on-ok:#ffffff; --bad:#a3322b; --on-bad:#ffffff;
    --gilt:#10241e; --gilt-shadow:none;
    --shadow:0 1px 2px rgba(16,36,30,.06),0 8px 24px rgba(16,36,30,.07);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e6ebe4; --bg-deep:#d9e0d8; --surface:#fbfcf8; --surface-2:#f0f3ec; --surface-3:#e2e9e0;
  --ink:#10241e; --ink-2:#4b5c54; --line:#c6d0c4; --rule:#a98a45;
  --brass:#94701f; --brass-hi:#b48a2c; --brass-lo:#5e4610; --on-brass:#ffffff;
  --ok:#1d7a48; --on-ok:#ffffff; --bad:#a3322b; --on-bad:#ffffff;
  --gilt:#10241e; --gilt-shadow:none;
  --shadow:0 1px 2px rgba(16,36,30,.06),0 8px 24px rgba(16,36,30,.07);
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
h2{font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 40,"SOFT" 40;font-size:1.32rem;letter-spacing:-.005em;margin:0 0 12px;line-height:1.2}
h3{font-weight:700}
p{margin:0 0 8px}
::selection{background:var(--brass);color:var(--on-brass)}

/* ---------- Header: the pub sign ---------- */
.app-head{background:#0b1b16;color:#f2ead6;padding:12px clamp(14px,3vw,28px);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border-bottom:1px solid #6e5c31;box-shadow:0 1px 0 #0b1b16,0 2px 0 rgba(201,162,77,.25)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 72,"SOFT" 60;font-size:clamp(1.25rem,2.6vw,1.75rem);margin:0;line-height:1.05;color:#efd690;letter-spacing:-.01em}
.brand .sub{margin:3px 0 0;font-size:.86rem;color:#bdb7a3;font-family:var(--display);font-style:italic;font-variation-settings:"opsz" 14}
.quiz-meta{flex:1 1 240px;text-align:right;min-width:0}
.quiz-title{font-family:var(--display);font-weight:600;font-size:1.12rem;overflow-wrap:anywhere;color:#f2ead6}
.indicator{font-size:.9rem;color:#bdb7a3;font-variant-numeric:tabular-nums}
.head-tools{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid #6e5c31;background:transparent;color:#efd690;font-size:1.1rem;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.icon-btn:hover{background:rgba(201,162,77,.12)}
.icon-btn:focus-visible{outline:2px solid #efd690;outline-offset:3px}
body.view-player .brand .sub{display:none}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:0 clamp(8px,3vw,24px);background:var(--bg-deep);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:0 0 auto;min-height:50px;padding:10px 18px;border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:1rem;cursor:pointer;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:-4px}

main{max-width:1400px;margin:0 auto;padding:clamp(14px,2.4vw,28px)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;cursor:pointer;touch-action:manipulation;text-align:center;line-height:1.2;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--rule)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.pad:focus-visible,.mini-pad:focus-visible,.choice button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass));border-color:var(--brass-lo);color:var(--on-brass);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 0 var(--brass-lo)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sage{background:var(--surface-3);border-color:var(--rule);color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:transparent}
.btn.big{min-height:60px;font-size:1.08rem;padding:12px 24px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spacer{flex:1 1 auto}
.muted{color:var(--ink-2)}
.hint{font-size:.92rem;color:var(--ink-2);margin:6px 0}
.keycap{display:inline-block;min-width:1.9em;text-align:center;padding:1px 7px;border-radius:6px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);font-weight:700;line-height:1.4;box-shadow:0 2px 0 var(--line)}

/* ---------- Panels ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(16px,2vw,22px);box-shadow:var(--shadow);min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.section-head h2{margin:0}

/* ---------- Host ---------- */
.host-grid{display:grid;gap:clamp(14px,2vw,22px);grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}
@media (max-width:920px){.host-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:clamp(14px,2vw,22px);min-width:0}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:700;font-size:.86rem}
.pill.pts{background:transparent;border-color:var(--rule);color:var(--brass-hi)}
:root[data-theme="light"] .pill.pts{color:var(--brass)}
.q-text{font-family:var(--display);font-weight:500;font-variation-settings:"opsz" 72,"SOFT" 30;font-size:clamp(1.55rem,3.2vw,2.45rem);line-height:1.2;letter-spacing:-.01em;margin:14px 0 18px;overflow-wrap:anywhere}
.answer-box{border:1px dashed var(--rule);border-radius:var(--r-md);padding:12px 16px;background:var(--surface-2)}
.answer-box.shown{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.answer-box .label{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.a-text{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,2.6vw,2rem);margin:4px 0 0;overflow-wrap:anywhere}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.controls{grid-template-columns:1fr 1fr}}

/* ---------- Timer ---------- */
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer-num{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums;font-variation-settings:"opsz" 72;font-size:2.3rem;font-weight:600;min-width:4.2ch}
.bar{height:10px;border-radius:999px;background:var(--bg-deep);border:1px solid var(--line);overflow:hidden;flex:1 1 160px}
.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi));transition:width .12s linear}
.timer.timer-low .bar>i{background:var(--bad)}
.timer.timer-low .timer-num{color:var(--bad)}

/* ---------- Buzzers (host) ---------- */
.status{font-weight:700;padding:3px 12px;border-radius:999px;font-size:.88rem}
.status.open{background:var(--ok);color:var(--on-ok)}
.status.closed{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.queue li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid transparent}
.queue li.active{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.queue li.wrong{color:var(--ink-2)}
.queue li.wrong strong{text-decoration:line-through}
.queue li.right{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.gain{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:2.4ch;text-align:right;color:var(--ok)}
.mark{display:flex;gap:6px}
.mark .btn{min-width:48px;font-size:1.1rem}
.swatch{width:22px;height:22px;border-radius:50%;flex:none;background:var(--c);border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.swatch.lg{width:34px;height:34px}
.judge{margin-top:10px;padding:12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--brass)}
.mini-pads{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini-pad{background:var(--c);color:var(--ci);border:none;border-radius:var(--r-sm);min-height:44px;padding:6px 14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.mini-pad.in{outline:2px solid var(--brass-hi);outline-offset:2px}

/* ---------- Scoreboard (host) ---------- */
.score-row{display:grid;grid-template-columns:2.2ch auto 1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.score-row:last-of-type{border-bottom:none}
.rank{font-family:var(--display);font-weight:600;color:var(--ink-2);text-align:right;font-variant-numeric:lining-nums}
.tname{font-weight:700;overflow-wrap:anywhere;min-width:0}
.tscore{font-family:var(--display);font-size:1.65rem;font-weight:600;font-variant-numeric:tabular-nums lining-nums;min-width:2.5ch;text-align:right}
.score-btns{display:flex;gap:6px}
@media (max-width:460px){.score-row{grid-template-columns:2.2ch auto 1fr auto}.score-btns{grid-column:1/-1;justify-content:flex-end}}

/* =====================================================================
   The player screen (what the room sees). The question is the star:
   set like gold-leaf lettering on a framed bar mirror.
   ===================================================================== */
body.view-player{background:radial-gradient(120% 90% at 50% 0%,var(--surface) 0%,var(--bg) 55%,var(--bg-deep) 100%) fixed}
.stage{display:flex;flex-direction:column;gap:clamp(10px,2vh,24px)}
.stage-top{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:baseline;font-size:clamp(1rem,1.7vw,1.35rem);color:var(--ink-2);padding-bottom:12px;border-bottom:1px solid var(--rule)}
.stage-top span:first-child{font-family:var(--display);font-style:italic;font-weight:500;color:var(--ink);font-size:1.15em}
.stage-q{position:relative;font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 50,"WONK" 0;font-size:clamp(1.8rem,min(5vw,7.4vh),4.4rem);line-height:1.12;letter-spacing:-.015em;text-align:center;margin:0 auto;max-width:24ch;overflow-wrap:anywhere;color:var(--gilt);text-shadow:var(--gilt-shadow);text-wrap:balance;padding:clamp(12px,3vh,40px) clamp(16px,4vw,56px)}
/* the mirror frame */
.stage-q::before{content:"";position:absolute;inset:0;border:1px solid var(--rule);border-radius:22px;box-shadow:0 0 0 6px transparent,0 0 0 7px color-mix(in srgb,var(--rule) 55%,transparent);pointer-events:none}
.stage-answer{text-align:center;font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 96;font-size:clamp(1.5rem,min(4vw,6vh),3.3rem);background:var(--ok);color:var(--on-ok);border-radius:var(--r-lg);padding:16px 28px;max-width:960px;width:100%;margin:0 auto;overflow-wrap:anywhere;animation:pop .4s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.stage-timer{max-width:960px;width:100%;margin:0 auto}
.stage-timer .timer-num{font-size:clamp(1.8rem,min(5vw,7vh),4.2rem)}
.stage-timer .bar{height:14px}
.stage-title{font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 50;text-align:center;font-size:clamp(2.2rem,5.4vw,4.2rem);margin:0;line-height:1.08;letter-spacing:-.015em;color:var(--gilt);text-shadow:var(--gilt-shadow);text-wrap:balance}
.stage-sub{text-align:center;font-size:clamp(1.05rem,2.2vw,1.5rem);color:var(--ink-2);max-width:42ch;margin:0 auto;text-wrap:balance}
.buzz-banner{text-align:center;font-weight:700;font-size:clamp(1.25rem,2.8vw,2.1rem);padding:14px 18px;border-radius:var(--r-lg);background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--on-brass);max-width:960px;width:100%;margin:0 auto;box-shadow:0 2px 0 var(--brass-lo),0 12px 28px rgba(0,0,0,.25)}
.buzz-banner.right{background:var(--ok);color:var(--on-ok);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.buzz-banner.quiet{background:transparent;color:var(--ink-2);border:1px solid var(--line);box-shadow:none;font-weight:400;font-size:clamp(1rem,1.9vw,1.35rem)}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(12px,1.6vw,20px);padding-top:10px}
.pad{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%,rgba(0,0,0,.14)),var(--c);color:var(--ci);border:none;border-radius:var(--r-lg);min-height:120px;padding:24px 16px 16px;font-weight:700;font-size:clamp(1.15rem,2.1vw,1.65rem);line-height:1.15;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.2);transition:transform .06s,box-shadow .06s,filter .2s;overflow-wrap:anywhere;touch-action:manipulation}
.pad:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 0 rgba(0,0,0,.35)}
.pad .key{position:absolute;top:9px;left:13px;font-size:.78rem;font-weight:700;opacity:.8}
.pad .order{position:absolute;top:-13px;right:-10px;min-width:46px;height:46px;padding:0 8px;border-radius:23px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--on-brass);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;border:3px solid var(--bg);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.pad .order.gain{background:var(--ok);color:var(--on-ok)}
.pad .ready{display:block;font-size:.72em;font-weight:400;margin-top:6px;opacity:.92}
.pad.first{outline:4px solid var(--brass-hi);outline-offset:5px;animation:pulse 1.1s ease-in-out infinite}
.pad.right,.pad.is-ready{outline:4px solid var(--ok);outline-offset:5px}
.pad.wrong{filter:grayscale(.85) brightness(.65)}
.pads.closed .pad:not(.in){filter:saturate(.3) brightness(.8);opacity:.6}
.pads.duel{grid-template-columns:1fr 1fr;gap:16px}
.pads.duel .pad{min-height:clamp(170px,34vh,380px);font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,4vw,2.8rem)}
.pads.duel .pad .key{font-family:var(--font);font-size:clamp(1rem,2.2vw,1.4rem);top:12px;left:16px}
.stage-tools{justify-content:center;opacity:.85}

/* ---------- Leaderboard ---------- */
.board{max-width:960px;width:100%;margin:0 auto;counter-reset:none}
.board-row{display:grid;grid-template-columns:2.5ch auto 1fr auto;gap:18px;align-items:center;padding:14px 22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-bottom:10px;font-size:clamp(1.15rem,2.4vw,1.85rem);font-weight:700}
.board-row>span:first-child{font-family:var(--display);font-weight:600;color:var(--ink-2);text-align:right;font-variant-numeric:lining-nums}
.board-row.top{border:1px solid var(--brass);box-shadow:0 0 0 1px var(--brass) inset,0 14px 30px rgba(0,0,0,.25);background:linear-gradient(180deg,color-mix(in srgb,var(--brass) 14%,var(--surface)),var(--surface))}
.board-row.top .tscore{color:var(--brass-hi)}
:root[data-theme="light"] .board-row.top .tscore{color:var(--brass)}
.board-row .tscore{font-size:1.2em}
.winner{font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 60;text-align:center;font-size:clamp(2.2rem,6vw,4.8rem);line-height:1.08;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere;color:var(--gilt);text-shadow:var(--gilt-shadow);text-wrap:balance}
.winner-sub{text-align:center;font-family:var(--display);font-style:italic;font-size:clamp(1.05rem,2.3vw,1.6rem);color:var(--ink-2)}

/* ---------- Setup ---------- */
.setup{display:grid;gap:clamp(14px,2vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.setup .card{background:var(--surface)}
.setup .wide{grid-column:1/-1}
.intro{background:linear-gradient(135deg,var(--surface-2),var(--surface))!important;border-color:var(--rule)!important}
.intro h2{font-size:1.6rem;font-variation-settings:"opsz" 72,"SOFT" 50}
.intro p{max-width:72ch}
.step-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.step-head h2{margin:0}
.step-no{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--brass);color:var(--brass-hi);font-family:var(--display);font-weight:600;font-size:1.15rem;flex:none;font-variant-numeric:lining-nums}
:root[data-theme="light"] .step-no{color:var(--brass)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{position:relative;min-height:96px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;font-size:1.05rem;cursor:pointer;padding:14px 16px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:border-color .15s,background .15s}
.choice button:hover{border-color:var(--rule)}
.choice button span{font-weight:400;font-size:.9rem;color:var(--ink-2)}
.choice button[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,var(--surface-2));box-shadow:0 0 0 1px var(--brass) inset}
.choice button[aria-pressed="true"]::after{content:"";position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 30%,transparent)}
.howto{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:var(--r-md);padding:14px 16px;margin:14px 0 0}
.howto h3{margin:0 0 4px;font-size:1.02rem}
.howto ol{margin:6px 0 0;padding-left:1.4em}
.howto li{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.94rem;margin-bottom:12px}
fieldset.field{border:none;padding:0;margin:0 0 12px}
fieldset.field legend{padding:0;margin-bottom:4px}
input,select,textarea{color:var(--ink);background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:46px;width:100%;transition:border-color .15s}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#ffffff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) input,:root:not([data-theme="dark"]) select,:root:not([data-theme="dark"]) textarea{background:#ffffff}}
input:hover,select:hover,textarea:hover{border-color:var(--rule)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
textarea{resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-weight:400;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--brass)}
.team-row{display:grid;grid-template-columns:56px auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.team-row .swatch.lg{justify-self:center}
.team-row.duel{grid-template-columns:56px auto 1fr}
input[type="color"]{padding:3px;height:46px;cursor:pointer}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px;margin-bottom:8px}
.round{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-bottom:12px;overflow:hidden}
.round-head{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface-2)}
.round-head input{flex:1 1 200px;width:auto;font-weight:700}
.round-no{font-family:var(--display);font-weight:600;min-width:2.2ch;color:var(--brass-hi);font-variant-numeric:lining-nums}
:root[data-theme="light"] .round-no{color:var(--brass)}
.qlist{list-style:none;margin:0;padding:0}
.qrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.qrow:last-child{border-bottom:none}
.qrow.current{background:color-mix(in srgb,var(--brass) 10%,var(--surface));box-shadow:3px 0 0 var(--brass) inset}
.qn{font-family:var(--display);font-weight:600;color:var(--ink-2);padding-top:2px;font-variant-numeric:lining-nums}
.qq{font-weight:700;overflow-wrap:anywhere}
.qa{color:var(--ok);font-weight:700;overflow-wrap:anywhere}
.qbtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.qrow{grid-template-columns:2em minmax(0,1fr)}.qbtns{grid-column:1/-1}}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;min-height:140px;margin:10px 0}
pre.sample{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;overflow-x:auto;margin:8px 0 0}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:48px 16px}
.empty .row{justify-content:center}

/* ---------- Modal + toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,12,10,.66);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:20px;max-width:580px;width:100%;max-height:90%;overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .22s ease-out}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.keys{width:100%;border-collapse:collapse}
.keys td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180%);background:#0b1b16;color:#f2ead6;border:1px solid #6e5c31;padding:12px 22px;border-radius:999px;font-weight:700;z-index:60;transition:transform .25s cubic-bezier(.2,.9,.3,1.1);max-width:min(92vw,560px);text-align:center;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}

/* ---------- Quiz formats ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px auto}
.tile{width:2.1em;height:2.5em;border-radius:6px;border:1px solid var(--line);background:var(--bg-deep);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.05rem}
.tile.on{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--on-brass);border-color:var(--brass-lo)}
.tile-gap{width:1em}
.tile-p{align-self:end;font-weight:700}
.tiles.big .tile{font-size:clamp(1rem,min(3.2vw,4.4vh),2.3rem)}
.stage-info{text-align:center;color:var(--ink-2);font-family:var(--display);font-style:italic;font-size:clamp(1rem,1.8vw,1.3rem);margin:0 auto;max-width:60ch}
.stage-clue{text-align:center;font-weight:700;background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 18px;max-width:900px;width:100%;margin:0 auto}
.stage-answer .note{display:block;font-family:var(--font);font-size:.45em;font-weight:400;margin-top:8px}
.ans-note{font-size:.94rem;color:var(--ink-2);margin:6px 0 0}
.recap{display:flex;flex-direction:column;gap:8px;max-width:1100px;width:100%;margin:0 auto}
.recap-row{display:grid;grid-template-columns:2.4ch 1fr;gap:14px;padding:12px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.recap-n{font-family:var(--display);font-weight:600;color:var(--brass-hi);font-size:clamp(1rem,2vw,1.4rem);font-variant-numeric:lining-nums}
:root[data-theme="light"] .recap-n{color:var(--brass)}
.recap-q{font-size:clamp(.95rem,1.6vw,1.15rem);color:var(--ink-2)}
.recap-a{font-family:var(--display);font-size:clamp(1.15rem,2.4vw,1.8rem);font-weight:600}
.recap-note{font-size:clamp(.85rem,1.4vw,1rem);color:var(--ink-2)}
.round-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.round-meta .field{margin:0;font-size:.88rem}
.score-in{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.score-in>span{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.score-in input{max-width:120px}
.tb-row{display:grid;grid-template-columns:2.2ch minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:600px){.tb-row{grid-template-columns:2.2ch 1fr}.tb-row input,.tb-row button{grid-column:2}}
.howto-list{padding-left:1.4em;margin:6px 0 10px}
.howto-list li{margin-bottom:6px}
.imp-list{margin:6px 0 8px;padding-left:1.3em}
.qnote{font-size:.86rem;color:var(--ink-2)}

/* ---------- Multiple choice and typed answers ---------- */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1040px;width:100%;margin:0 auto}
.opt{display:flex;align-items:center;gap:14px;padding:clamp(8px,1.6vh,16px) 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:clamp(1.05rem,min(2.5vw,4vh),1.85rem);overflow-wrap:anywhere;transition:opacity .3s,background .3s}
.opt-l{display:inline-grid;place-items:center;flex:none;width:1.9em;height:1.9em;border-radius:50%;background:transparent;border:1px solid var(--brass);color:var(--brass-hi);font-family:var(--display);font-weight:600}
:root[data-theme="light"] .opt-l{color:var(--brass)}
.opt.right{border-color:var(--ok);background:var(--ok);color:var(--on-ok)}
.opt.right .opt-l{background:var(--on-ok);color:var(--ok);border-color:var(--on-ok)}
.opt.dim{opacity:.4}
.opt-grid.small{margin:10px 0 0}
.opt-grid.small .opt{font-size:.98rem;padding:8px 12px}
.team-ans-list{display:flex;flex-direction:column;gap:8px;max-width:1040px;width:100%;margin:0 auto}
.team-ans{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:6px 0 0 var(--c) inset}
.team-ans-name{font-weight:700;font-size:clamp(1rem,2.1vw,1.45rem);flex:1 1 160px;overflow-wrap:anywhere;padding-left:6px}
.tap-btns{display:flex;gap:8px}
.opt-btn{width:clamp(48px,7vw,72px);height:clamp(48px,7vw,72px);border-radius:var(--r-md);border:none;background:var(--c);color:var(--ci);font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,3vw,2rem);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 0 rgba(0,0,0,.32);touch-action:manipulation}
.opt-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.opt-btn:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}
.ans-chip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;overflow-wrap:anywhere;max-width:100%}
.ans-chip.right{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.ans-chip.wrong{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.gain-pill{display:inline-block;padding:4px 12px;border-radius:999px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--on-brass);font-weight:700}
.tap-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.tap-row .tname{flex:1 1 120px}
.ph-opts{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ph-opt .opt-l{width:2.2em;height:2.2em;font-size:1.2rem}
.ph-opt.picked{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset;background:color-mix(in srgb,var(--brass) 12%,var(--surface))}
.ph-opt.right{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.ph-opt.wrong{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.ph-opt.dim{opacity:.4}
.ph-opt.right .opt-l{background:var(--on-ok);color:var(--ok);border-color:var(--on-ok)}
.ph-opt.wrong .opt-l{background:var(--on-bad);color:var(--bad);border-color:var(--on-bad)}
.ph-type{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;justify-content:center}
.ph-type input{font-size:1.3rem;min-height:60px}
.ph-sent{flex:1 1 auto;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:1.6rem;font-weight:600;border:1px dashed var(--rule);border-radius:24px;padding:16px;overflow-wrap:anywhere}

/* ---------- Quiz library ---------- */
.lib-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:2px}
.lib-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.lib-row.current{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.lib-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px;overflow-wrap:anywhere}

/* ---------- Phone buzzers: host side ---------- */
.sub-h{font-size:1.05rem;margin:18px 0 8px}
.net-status{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.net-status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink-2);flex:none}
.net-status.online::before{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.net-status.connecting::before{background:var(--brass)}
.net-status.offline::before,.net-status.refused::before,.net-status.noserver::before{background:var(--bad)}
.join-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}
.qr{display:block;border-radius:12px;background:#fff;max-width:100%;height:auto;padding:4px;box-shadow:0 0 0 1px var(--rule),0 10px 24px rgba(0,0,0,.25)}
.room-code{font-family:var(--display);font-size:2.2rem;font-weight:600;letter-spacing:.14em;margin:0;font-variant-numeric:lining-nums;color:var(--brass-hi)}
:root[data-theme="light"] .room-code{color:var(--brass)}
.join-url{font-size:.85rem;word-break:break-all;color:var(--ink-2);-webkit-user-select:all;user-select:all;margin:4px 0 0}
.join-panel{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:22px;max-width:960px;width:100%;margin:0 auto;box-shadow:var(--shadow)}
.join-panel .qr{width:clamp(180px,26vw,300px)}
.join-approvals{border:2px solid var(--gold,#bea36b);margin-bottom:18px}
.join-approvals .approval-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--rule)}
.join-approvals .approval-entry:first-of-type{border-top:0}
.join-approvals .approval-buttons{display:flex;gap:8px;flex-wrap:wrap}
.join-approvals h2{margin:0 0 6px}
.join-approvals p{margin:4px 0}
.ph-await{border:1px solid #bb9b59;background:rgba(175,136,57,.12);border-radius:18px;padding:20px;margin:18px 0;text-align:center}
.ph-await h2{margin:4px 0 10px}
.join-panel h3{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,3vw,2.2rem);margin:0 0 8px}
.warn{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad);border-radius:var(--r-md);padding:12px 14px;margin:10px 0}
.tv-pair{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tv-pair input{width:7.5ch;flex:none;font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums lining-nums}

/* ---------- Phone buzzers: phone side ---------- */
body.phone{height:100%;background:radial-gradient(140% 80% at 50% 0%,var(--surface) 0%,var(--bg) 60%)}
.phone-app{max-width:560px;height:100%;margin:0 auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.ph-title{font-family:var(--display);font-weight:600;font-size:1.12rem;overflow-wrap:anywhere}
.ph-chip{background:var(--c);color:var(--ci);border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:1.05rem;min-height:48px;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ph-score{font-family:var(--display);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums lining-nums}
.ph-q{min-height:2.5em}
.ph-q p{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.25;margin:4px 0;overflow-wrap:anywhere}
.ph-qn{font-weight:700;color:var(--ink-2);font-size:.9rem}
.ph-a{color:var(--ok);font-weight:700}
.ph-buzz{flex:1 1 auto;min-height:220px;width:100%;border:none;border-radius:32px;background:radial-gradient(120% 90% at 50% 15%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);color:var(--ci);font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 60;font-size:clamp(2.6rem,13vw,4.8rem);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 0 rgba(0,0,0,.38),0 20px 40px rgba(0,0,0,.3);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.ph-buzz:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 0 rgba(0,0,0,.38)}
.ph-buzz.off{filter:saturate(.35) brightness(.8);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ph-buzz.off:active{transform:none}
.ph-buzz.win{outline:6px solid var(--ok);outline-offset:-10px;filter:none}
.ph-buzz:focus-visible{outline:3px solid var(--brass-hi);outline-offset:4px}
.ph-status{text-align:center;font-weight:700;font-size:1.3rem;min-height:2.6em;margin:0}
.ph-foot{display:flex;justify-content:space-between;gap:10px;color:var(--ink-2);font-size:.9rem}
.ph-h{font-family:var(--display);font-weight:600;font-size:1.75rem;margin:6px 0}
.ph-teams{display:grid;gap:12px}
.ph-team{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 50%),var(--c);color:var(--ci);border:none;border-radius:var(--r-lg);min-height:72px;padding:10px;font-weight:700;font-size:1.3rem;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 5px 0 rgba(0,0,0,.32);cursor:pointer;overflow-wrap:anywhere}
.ph-msg{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:12px}
.ph-msg h1{font-family:var(--display);font-weight:600;font-size:2rem;margin:0;color:var(--gilt);text-shadow:var(--gilt-shadow)}
.ph-warn{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--on-brass);border-radius:var(--r-md);padding:8px 12px;font-weight:700;text-align:center;margin:0}

/* ---------- TV screen mode (/tv) ---------- */
html.is-screen .tabs,html.is-screen .head-tools{display:none}
html.is-screen .app-head{padding-block:10px}
html.is-screen .pad{cursor:default}
html.is-screen .pad:active{transform:none}
html.is-screen main{max-width:1600px;padding:clamp(10px,2vh,24px) clamp(16px,3vw,40px)}
html.is-screen .app-head{padding:6px clamp(14px,3vw,28px)}
html.is-screen .brand svg{width:34px;height:34px}
html.is-screen .brand h1{font-size:clamp(1rem,1.6vw,1.3rem)}
/* a TV can't be tapped: keep its few controls out of the way, bottom right */
html.is-screen .stage-tools{position:fixed;right:12px;bottom:12px;z-index:4;opacity:0;pointer-events:none;transition:opacity .3s;background:var(--bg-deep);border:1px solid var(--rule);border-radius:var(--r-md);padding:8px}
html.is-screen.show-tools .stage-tools,html.is-screen .stage-tools:focus-within{opacity:1;pointer-events:auto}
html.is-screen .team-ans-list{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
html.is-screen .team-ans{flex:0 1 auto;padding:6px 14px 6px 12px;gap:8px}
html.is-screen .team-ans .tap-btns{display:none}
html.is-screen .team-ans-name{flex:0 1 auto;font-size:clamp(.95rem,1.6vw,1.25rem)}
html.is-screen .stage-timer .timer-num{font-size:clamp(1.6rem,min(4vw,6vh),3.6rem)}
.screen-wait{min-height:calc(100vh - 140px);display:grid;place-items:center;text-align:center}
.screen-wait .inner{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:60ch}
.screen-code{display:flex;gap:clamp(10px,1.4vw,18px);margin:8px 0 4px}
.screen-code span{display:grid;place-items:center;width:clamp(72px,9vw,140px);aspect-ratio:3/4;border-radius:16px;border:1px solid var(--rule);background:var(--surface);font-family:var(--display);font-weight:600;font-variation-settings:"opsz" 144;font-size:clamp(3rem,7vw,6rem);color:var(--gilt);text-shadow:var(--gilt-shadow);box-shadow:var(--shadow)}
.screen-steps{text-align:left;font-size:clamp(1.05rem,1.8vw,1.4rem);margin:0;padding-left:1.4em;color:var(--ink)}
.screen-steps li{margin-bottom:8px}
.screen-note{color:var(--ink-2);font-size:clamp(.95rem,1.4vw,1.15rem)}

/* short screens (720p TVs, small laptops): keep the whole question on one screen */
@media (max-height:940px){
  body.view-player .stage{gap:1.3vh}
  body.view-player .stage-top{padding-bottom:6px;font-size:clamp(.95rem,1.5vw,1.2rem)}
  body.view-player .stage-q{font-size:clamp(1.6rem,min(4.6vw,6.2vh),3.6rem);padding:2vh 3vw}
  body.view-player .opt{font-size:clamp(1rem,min(2.3vw,3.4vh),1.6rem);padding:1.1vh 16px}
  body.view-player .opt-grid{gap:1.4vh 14px}
  body.view-player .tiles.big .tile{font-size:clamp(.95rem,min(3vw,3.8vh),2rem)}
  html.is-screen .app-head{padding-block:4px}
  html.is-screen .team-ans{padding:4px 10px}
  html.is-screen .team-ans-name{font-size:clamp(.85rem,1.3vw,1.05rem)}
}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =======================================================================
   QUIZ NIGHT LIVE — 2026 visual system
   A broadcast-style layer over the proven quiz mechanics. No CDN/assets.
   ======================================================================= */
:root{
  --bg:#071814; --bg-deep:#06120f; --surface:#102922;
  --surface-2:#17362d;--surface-3:#22473c;
  --ink:#f8f4e6; --ink-2:#b6c4b8;--line:#2a493f;--rule:#8d794b;
  --brass:#d5ad61;--brass-hi:#ffdea0;--brass-lo:#84602b;
  --gilt:#fff0c3;--r-lg:22px;--r-md:15px;--r-sm:10px;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset,0 16px 38px rgba(1,10,8,.22);
}
body{background:radial-gradient(ellipse 80vw 44vw at 50% -26vw,rgba(59,123,94,.12),transparent),var(--bg);letter-spacing:.005em}
.app-head{position:relative;background:linear-gradient(115deg,#081b15,#102c25 54%,#081b15);border-bottom:1px solid rgba(216,177,94,.47);padding:17px clamp(18px,3vw,45px);box-shadow:0 12px 30px rgba(0,0,0,.1)}
.app-head:after{content:"";position:absolute;inset:auto 8% -1px; height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,113,.6),transparent)}
.brand{gap:15px}
.brand svg{filter:drop-shadow(0 2px 6px rgba(222,178,86,.22))}
.brand h1{font-size:clamp(1.4rem,2.2vw,2.1rem);font-weight:730;letter-spacing:-.035em;color:#ffdfa1}
.brand .sub{font-family:var(--font);font-size:.62rem;font-weight:700;letter-spacing:.17em;color:#d1bb8d;font-style:normal;text-transform:uppercase;margin-top:6px}
.quiz-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.live-badge,.kicker{font-family:var(--font);font-size:.69rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:#d6b575}
.live-badge{display:inline-flex;align-items:center;gap:9px;background:rgba(224,179,92,.09);border:1px solid rgba(224,179,92,.28);padding:4px 11px;border-radius:99px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#66cc9d;box-shadow:0 0 0 4px rgba(102,204,157,.15)}
.quiz-title{font-size:1.04rem;color:#fff5da}
.indicator{color:#b3c9b9;font-size:.8rem}
.tabs{background:rgba(6,20,16,.96);border-bottom:1px solid var(--line);padding-inline:clamp(12px,4vw,42px)}
.tab{min-height:56px;border-bottom-width:2px;font-size:.93rem;letter-spacing:.02em;padding-inline:22px}
.tab[aria-selected="true"]{color:var(--brass-hi);background:linear-gradient(180deg,transparent,rgba(219,180,100,.055))}
main{max-width:1480px;padding:clamp(18px,2.8vw,38px)}
.card{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 91%,#fff),var(--surface));border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2vw,27px);box-shadow:var(--shadow)}
.card h2{font-weight:680;letter-spacing:-.02em;font-size:1.48rem}
.card .sub-h{color:var(--brass-hi);font-weight:700;font-size:.97rem}
.btn{border-radius:12px;letter-spacing:.015em;transition:background .2s,border-color .2s,box-shadow .2s,transform .1s}
.btn.primary{background:linear-gradient(165deg,#ffe4a9,#d7a956);border-color:#d0a156;box-shadow:0 1px 0 rgba(255,255,255,.38) inset,0 6px 20px rgba(217,166,77,.14);color:#241807}
.btn.primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 24px rgba(217,166,77,.28)}
.btn.sage{border-color:var(--rule);background:linear-gradient(120deg,var(--surface-3),var(--surface-2))}
.field{gap:8px}
input,select,textarea{border-radius:11px}
.pill{padding:5px 13px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 80%,transparent);font-size:.77rem;letter-spacing:.045em;text-transform:uppercase}
.pill.pts{border-color:rgba(223,178,89,.46);color:var(--brass-hi);background:rgba(220,171,79,.08)}
.q-text{line-height:1.15;font-weight:600;letter-spacing:-.025em}
.host-grid{grid-template-columns:minmax(0,1.45fr) minmax(350px,1fr);gap:20px}
.host-grid .col{gap:16px}
.answer-box{border-radius:14px;background:var(--bg-deep);border:1px solid var(--rule)}
.answer-box.shown{background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.score-row{grid-template-columns:2ch 43px minmax(85px,1fr) auto auto;gap:8px;border-color:var(--line);padding:10px 0}
.score-row .tscore{font-family:var(--font);font-size:1.24rem;color:var(--brass-hi);font-variant-numeric:tabular-nums}
.score-row .score-btns .btn{min-height:38px;padding:6px 10px;font-size:.83rem}
.score-row .tname{font-size:.93rem}
.team-avatar{display:block;aspect-ratio:1/1;object-fit:cover;flex:none;width:48px;height:48px;border-radius:50%;background:#102920}
.team-avatar-ring{display:inline-flex;align-items:center;justify-content:center;flex:none;width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--c,var(--brass)),var(--brass-hi));box-shadow:0 0 0 1px rgba(255,255,255,.08),0 2px 10px rgba(0,0,0,.18)}
.team-avatar-ring .team-avatar{width:100%;height:100%;border:2px solid var(--surface)}
.score-row .team-avatar-ring{width:40px;height:40px}
.queue .team-avatar-ring{width:38px;height:38px}
.mini-pad{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);border:1px solid var(--c);border-left:5px solid var(--c);border-radius:10px;box-shadow:none}
.mini-pad.in{outline-color:var(--ok)}
/* Setup dashboard: the first screen should feel like a launch console. */
.setup{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.setup .intro{position:relative;isolation:isolate;overflow:hidden;padding:34px clamp(22px,4vw,52px);background:radial-gradient(circle at 94% 15%,rgba(234,189,108,.17),transparent 28%),linear-gradient(115deg,#173e31,#0c211c 76%)!important;border:1px solid rgba(236,196,116,.42)}
.setup .intro:before{content:"";position:absolute;z-index:-1;right:-36px;top:-84px;width:330px;height:330px;border:1px solid rgba(231,188,113,.14);border-radius:50%;box-shadow:0 0 0 38px rgba(231,188,113,.05),0 0 0 76px rgba(231,188,113,.035)}
.setup .intro h2{font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.04;letter-spacing:-.035em;max-width:17ch;color:#ffe2a7;margin:12px auto 14px}
.setup .intro p{max-width:70ch;color:#d5e5d8;font-size:1.06rem;margin-inline:auto}
.step-head{margin-bottom:17px}
.step-head h2{font-weight:650}
.step-no{background:linear-gradient(140deg,#f5d99b,#c99547);color:#251805;box-shadow:0 4px 14px rgba(230,183,102,.18);border-radius:12px}
.team-row{grid-template-columns:60px 42px 38px minmax(70px,1fr) auto;gap:9px;align-items:center}
.team-row.duel{grid-template-columns:60px 42px 38px minmax(70px,1fr)}
.team-row.new-team-row{grid-template-columns:60px 42px minmax(70px,1fr) auto}
.team-row input[type="color"]{height:43px;min-width:40px;border-radius:12px;padding:4px}
.avatar-edit{width:58px;height:58px;border:1px solid var(--rule);background:var(--surface-2);border-radius:17px;position:relative;padding:3px;cursor:pointer;transition:border-color .15s,transform .15s}
.avatar-edit:hover{border-color:var(--brass-hi);transform:translateY(-2px)}
.avatar-edit .team-avatar{width:100%;height:100%;border-radius:14px}
.avatar-edit-mark{position:absolute;bottom:-5px;right:-5px;font-size:13px;line-height:20px;width:23px;height:23px;background:#f1d599;color:#2d2516;border:2px solid var(--surface);border-radius:50%;text-align:center}
.avatar-tip{padding:8px 12px;background:color-mix(in srgb,var(--brass) 8%,var(--surface));border-radius:10px}
.modal-box:has(.avatar-dialog){max-width:940px}
.avatar-dialog h2{font-size:1.9rem;margin:8px 0}
.avatar-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:11px;max-height:min(62vh,580px);overflow-y:auto;padding:7px 4px 16px}
.avatar-choice{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);padding:10px 8px;border-radius:15px;min-height:137px;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.avatar-choice img{width:82px;height:82px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.avatar-choice span{text-align:center;font-size:.75rem;font-weight:700;line-height:1.15}
.avatar-choice:hover{transform:translateY(-2px);border-color:var(--brass)}
.avatar-choice.selected,.avatar-choice[aria-pressed="true"]{border:2px solid var(--brass-hi);background:color-mix(in srgb,var(--brass) 16%,var(--surface));box-shadow:0 0 0 2px rgba(221,184,100,.15)}
.avatar-choice:focus-visible,.avatar-edit:focus-visible{outline:3px solid var(--brass-hi);outline-offset:3px}
/* TV is intentionally always dark; dark text on the lit stage is not permitted. */
body.view-player,body.phone{
  --bg:#071814;--bg-deep:#06120f;--surface:#102922;--surface-2:#17362d;
  --ink:#f8f4e6;--ink-2:#b6c4b8;--line:#2a493f;--rule:#8d794b;
  --brass:#d5ad61;--brass-hi:#ffdea0;--gilt:#fff0c3;
  --gilt-shadow:0 3px 22px rgba(210,168,88,.16);
}
body.view-player{min-height:100dvh;background:radial-gradient(ellipse 70% 50% at 50% -20%,#275446 0%,transparent 74%),linear-gradient(160deg,#071915,#09241e 48%,#06130f) fixed}
body.view-player main{max-width:1500px}
.stage{position:relative;gap:clamp(9px,1.7vh,17px);padding:clamp(14px,2vw,28px);border:1px solid rgba(214,174,91,.3);border-radius:26px;overflow:visible;isolation:isolate;background:radial-gradient(ellipse 65% 100% at 50% -65%,rgba(114,205,151,.11),transparent),linear-gradient(165deg,rgba(27,62,48,.60),rgba(6,20,17,.85));box-shadow:0 25px 60px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.08)}
.stage:before{content:"";position:absolute;inset:8px;z-index:-1;border:1px solid rgba(225,189,109,.11);border-radius:20px;pointer-events:none}
.stage-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border-bottom:1px solid rgba(213,173,97,.3);padding:0 5px 14px;font-size:clamp(.88rem,1.4vw,1.16rem);font-weight:700;letter-spacing:.045em}
.stage-top span:first-child{font-family:var(--font);font-style:normal;font-weight:700;font-size:.9em;letter-spacing:.16em;text-transform:uppercase;color:#e9c985}
.stage-top span:nth-child(2){color:#f9f2df;text-align:center}
.stage-top span:last-child{text-align:right;color:#d5b879;font-size:.85em}
.stage-kicker{text-align:center;margin:4px auto 0;display:block}
.stage-q{max-width:27ch;width:min(100%,1210px);font-size:clamp(1.9rem,min(4.5vw,6.7vh),4.25rem);padding:clamp(22px,3.4vh,44px) clamp(26px,5vw,65px);font-weight:650;line-height:1.16;letter-spacing:-.032em;background:radial-gradient(ellipse at 50% -5%,rgba(205,160,81,.15),transparent 70%),linear-gradient(155deg,rgba(17,47,38,.82),rgba(8,25,22,.97));border-radius:20px;color:#fff1c9;text-shadow:0 2px 24px rgba(238,181,89,.1);box-shadow:inset 0 1px rgba(255,255,255,.08),0 15px 25px rgba(0,0,0,.14);animation:question-rise .28s ease-out both}
.stage-q:before{inset:0;border:1px solid rgba(232,190,104,.44);border-radius:20px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.01)}
.stage-answer{background:linear-gradient(105deg,#276744,#469767,#276744);border:1px solid #7bd5a3;color:#fff9df;max-width:1100px;border-radius:15px;box-shadow:0 6px 30px rgba(50,159,97,.23)}
.stage-timer{max-width:1100px}
.stage-timer .timer{gap:12px}
.stage-timer .timer-num{font-family:var(--font);font-size:clamp(1.25rem,2vw,1.65rem);font-weight:700;width:5ch;min-width:5ch;color:#ecd69f}
.stage-timer .bar{height:9px;border:none;background:#264338}
.stage-timer .bar>i{background:linear-gradient(90deg,#f0bd60,#ffecac)}
.stage-title{font-size:clamp(2.5rem,6.3vw,5.4rem);font-weight:650;text-shadow:0 6px 38px rgba(231,176,86,.2)}
.stage-sub{max-width:60ch;font-size:clamp(.96rem,1.7vw,1.24rem)}
.buzz-banner{font-size:clamp(1rem,1.8vw,1.45rem);padding:9px 15px;max-width:1100px;background:linear-gradient(110deg,#edca82,#c7974b);border:1px solid #ffe7b0;box-shadow:0 7px 28px rgba(199,151,75,.12);border-radius:12px}
.buzz-banner.right{background:linear-gradient(100deg,#32895a,#4ba16c);border-color:#76cea1}
.buzz-banner.quiet{border-color:var(--line);font-size:clamp(.93rem,1.5vw,1.12rem)}
.opt-grid{max-width:1100px;gap:clamp(8px,1vw,14px)}
.opt{background:linear-gradient(125deg,#173c30,#0e2a24);border:1px solid rgba(204,187,134,.22);border-radius:15px;padding:clamp(11px,1.6vh,19px);font-size:clamp(1.01rem,min(2.0vw,3.4vh),1.65rem);line-height:1.15;box-shadow:inset 0 1px rgba(255,255,255,.045)}
.opt-l{width:2.15em;height:2.15em;border-radius:11px;border:1px solid rgba(252,223,157,.6);color:#ffe2a7;background:rgba(248,207,131,.08);font-family:var(--font);font-size:.82em}
.opt.right{background:linear-gradient(115deg,#28774e,#32915f);border-color:#7fdfac;color:#fff}
.opt.right .opt-l{background:#fff4cb;color:#236a47;border-color:#fff4cb}
.opt.dim{opacity:.44}
.team-ans-list{max-width:1200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
.team-ans{flex-wrap:nowrap;padding:7px 10px;background:rgba(16,42,34,.9);border-radius:11px;box-shadow:inset 3px 0 var(--c)}

.pads{grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;padding-top:6px}
.pad{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;min-height:148px;padding:13px 10px 16px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%),#102b26;border:1px solid color-mix(in srgb,var(--c) 70%,#d9ba80);border-bottom:4px solid var(--c);border-radius:17px;color:#fff5df;font-size:clamp(.9rem,1.4vw,1.2rem);box-shadow:0 11px 27px rgba(0,0,0,.18);text-shadow:none}

.pad .team-avatar{width:clamp(46px,6vw,80px);height:clamp(46px,6vw,80px);box-shadow:0 0 0 2px var(--c),0 8px 20px rgba(0,0,0,.22)}
.pad .pad-name{text-align:center;max-width:100%}
.pad .key{top:8px;left:10px;background:rgba(224,207,165,.12);border:1px solid rgba(222,188,113,.35);border-radius:6px;padding:2px 7px;font-size:.65rem;letter-spacing:.08em;color:#ffe2ad}
.pad .ready{font-size:.73rem;color:#d4e4d7}
.pad.first{outline:2px solid #e6bd68;outline-offset:2px;box-shadow:0 0 32px rgba(226,184,87,.24)}
.pad.is-ready,.pad.right{outline:2px solid #58ce92;outline-offset:2px}
.pads.duel .pad{min-height:250px}
.pads.duel .pad .team-avatar{width:clamp(70px,13vw,130px);height:clamp(70px,13vw,130px)}
.pads.duel .pad-name{font-size:clamp(1.2rem,2.8vw,2rem)}
.stage-tools{opacity:.75}
/* Broadcast leaderboard + winner podium */
.board-premium{max-width:1100px;display:grid;gap:8px}
.board-premium .board-row{margin:0;padding:10px 18px;grid-template-columns:2ch 56px minmax(0,1fr) auto;background:linear-gradient(105deg,rgba(35,73,56,.76),rgba(10,30,25,.95));border-radius:13px;font-size:clamp(1rem,2vw,1.5rem);box-shadow:none}
.board-premium .team-avatar-ring{width:54px;height:54px}
.board-premium .board-row.top{background:linear-gradient(110deg,rgba(121,91,42,.48),rgba(27,46,35,.97));border:1px solid rgba(253,205,113,.7)}
.board-premium .board-row .tscore{font-family:var(--font);font-size:1.18em}
.winner{font-size:clamp(2rem,5vw,4.25rem);text-shadow:0 3px 22px rgba(226,169,76,.2)}
.winner-sub{margin:6px 0 0;color:#d3bb88}
.finals-stage .board{max-width:930px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,24px);margin:20px auto 8px;width:min(100%,850px)}
.podium-team{min-width:0;flex:1 1 0;display:flex;align-items:center;flex-direction:column;gap:7px;text-align:center}

.podium-team.place-3{order:3}

.podium-face img{width:100%;height:100%;border-radius:50%}
.place-1 .podium-face{width:clamp(86px,14vw,151px);height:clamp(86px,14vw,151px);border-color:#ffe1a1;box-shadow:0 0 36px rgba(228,179,85,.32)}
.podium-team strong{font-size:clamp(.85rem,1.5vw,1.1rem);line-height:1.2;max-width:100%}
.podium-rank{color:#e4ca96;font-weight:700}
.podium-points{color:#c8d5c9;font-weight:700;font-size:.82rem}
.podium-plinth{width:100%;height:50px;display:grid;place-items:center;background:linear-gradient(180deg,#9e854d,#5b482b);border-radius:12px 12px 0 0;color:#fff3cf;font-family:var(--display);font-size:2.1rem}

.place-3 .podium-plinth{background:linear-gradient(180deg,#8c7164,#4f4038)}
/* Phone: clear identity, tap targets and unmistakable input states */

<script>
(() => {
'use strict';

/* ---------- Constants & starter pack ---------- */
const KEY = 'pqp.v1';
const TEAM_COLOURS = ['#a8322d','#2a5caa','#3d8c55','#6b3fa0','#c8781e','#1f8a8a','#b8487a','#7a5232','#4f6070','#8f8a2a'];
const MAX_TEAMS = 10;
/* QUIZ SOCIETY v3.2 — production PNG artwork optimised to local WebP assets. */
const AVATARS = [{"id":"professor","name":"The Professor"},{"id":"landlady","name":"The Landlady"},{"id":"captain","name":"The Captain"},{"id":"historian","name":"The Historian"},{"id":"barrister","name":"The Barrister"},{"id":"headmaster","name":"The Headmaster"},{"id":"music-buff","name":"The Music Buff"},{"id":"craft-beer-expert","name":"The Craft Beer Expert"},{"id":"detective","name":"The Detective"},{"id":"quiz-mum","name":"The Quiz Mum"},{"id":"data-analyst","name":"The Data Analyst"},{"id":"pub-philosopher","name":"The Pub Philosopher"},{"id":"duchess","name":"The Duchess"},{"id":"showman","name":"The Showman"},{"id":"inventor","name":"The Inventor"},{"id":"bookmaker","name":"The Bookmaker"},{"id":"night-mayor","name":"The Night Mayor"},{"id":"broadcaster","name":"The Broadcaster"},{"id":"raven-scholar","name":"The Raven Scholar"},{"id":"lionheart","name":"The Lionheart"},{"id":"oracle","name":"The Oracle"},{"id":"chancellor","name":"The Chancellor"},{"id":"falcon","name":"The Falcon"},{"id":"luminary","name":"The Luminary"}];
const AVATAR_IDS = AVATARS.map(a => a.id);
/* Migrate existing v3.1 saved mascot selections without changing teams, scores or quizzes. */
const LEGACY_AVATARS = {'owl':'professor','fox':'raven-scholar','bear':'lionheart','badger':'duchess','duck':'music-buff','robot':'data-analyst','cat':'oracle','frog':'landlady','rabbit':'falcon','ghost':'pub-philosopher','wizard':'historian','raccoon':'detective','lion':'lionheart','penguin':'broadcaster','astronaut':'inventor','sausage':'craft-beer-expert','unicorn':'luminary','koala':'headmaster','monkey':'showman','dog':'detective','alien':'oracle','dragon':'captain','mouse':'quiz-mum','pirate':'captain'};
const avatarId = (v, i = 0) => AVATAR_IDS.includes(v) ? v : (Object.prototype.hasOwnProperty.call(LEGACY_AVATARS, v) ? LEGACY_AVATARS[v] : AVATAR_IDS[((i % AVATAR_IDS.length) + AVATAR_IDS.length) % AVATAR_IDS.length]);
const AVATAR_DURATION = 3500;
const avatarSrc = (v, state = 'idle') => '/assets/avatars/quiz-society/' + avatarId(v) + '-' + (['wrong','win'].includes(state) ? state : 'correct') + '.webp';
function winningTeamIds(st){
  if (!st.finished || !st.teams.length) return [];
  const top = Math.max(...st.teams.map(t => t.score));
  const tied = st.teams.filter(t => t.score === top).map(t => t.id);
  return st.tb && tied.includes(st.tb.winner) ? [st.tb.winner] : tied;
}
function avatarStateFor(t, st = S, now = Date.now()){
  if (!t) return 'idle';
  if (winningTeamIds(st).includes(t.id)) return 'win';
  const fx = st.avatarFx && st.avatarFx[t.id];
  return fx && fx.until > now && ['correct','wrong'].includes(fx.st) ? fx.st : 'idle';
}
function avatarHTML(t, size = ''){
  const id = t && t.id || '', av = avatarId(t && t.avatar);
  const state = avatarStateFor(t);
  return `<img class="team-avatar ${size} avatar-state-${state}" data-team-id="${esc(id)}" data-avatar-id="${av}" data-avatar-state="${state}" src="${avatarSrc(av, state)}" alt="" draggable="false" loading="eager">`;
}
/* Time-bound, host-authoritative reaction events. Correct means correct regardless of speed points. */
function setAvatarReaction(id, state){
  if (!team(id)) return;
  if (!S.avatarFx || typeof S.avatarFx !== 'object') S.avatarFx = {};
  if (state === 'right' || state === 'correct') S.avatarFx[id] = {st:'correct',until:Date.now() + AVATAR_DURATION};
  else if (state === 'wrong') S.avatarFx[id] = {st:'wrong',until:Date.now() + AVATAR_DURATION};
  else delete S.avatarFx[id];
}
function refreshVisibleAvatars(){
  if (SCREEN && !SCREEN_LIVE) return;
  document.querySelectorAll('img[data-team-id][data-avatar-id]:not(.phone-avatar)').forEach(img => {
    const teamId=img.dataset.teamId;
    const state=avatarStateFor({id:teamId});
    if (img.dataset.avatarState === state) return;
    img.dataset.avatarState=state;
    img.src=avatarSrc(img.dataset.avatarId,state);
    img.classList.remove('avatar-state-idle','avatar-state-correct','avatar-state-wrong','avatar-state-win');
    img.classList.add('avatar-state-'+state);
  });
}

const DUEL_KEYS = ['Z','M'];
const DEFAULT_TEAM_NAMES = ['The Quizzly Bears','Les Quizerables','Universally Challenged','Agatha Quiztie'];

const STARTER = {
  'General Knowledge': [
    ['How many sides does a hexagon have?','Six'],
    ['What is the chemical symbol for gold?','Au'],
    ['Which planet is known as the Red Planet?','Mars'],
    ['How many minutes are there in a day?','1,440'],
    ['What is the largest ocean on Earth?','The Pacific Ocean'],
    ['How many players does one rugby union team have on the pitch?','15'],
    ['What colour do you get by mixing blue and yellow paint?','Green'],
    ['In which city would you find the Colosseum?','Rome']
  ],
  'Geography': [
    ['What is the capital city of Australia?','Canberra'],
    ['What is the longest river in the United Kingdom?','The River Severn'],
    ['What is the capital city of Canada?','Ottawa'],

function inkFor(hex){
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  const L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? '#ffffff' : '#111111';
}

function makeRound(name, items, pts, cat){

}
function starterRounds(cats, per, pts, mix, mode){
  mode = ['choice', 'typed', 'buzz', 'written'].includes(mode) ? mode : 'choice';
  return cats.map(c => {
    const sp = STARTER_SPECIAL[c];
    if (sp) return Object.assign(makeRound(c, sp.items, pts, c), { info: sp.info || '', type: sp.type || 'standard', mystery: sp.mystery || '', clue: sp.clue || '', mode });
    if (!STARTER[c]) return null;
    let items = STARTER[c].slice();
    if (mix) shuffle(items);
    return Object.assign(makeRound(c, items.slice(0, per), pts, c), { mode });
  }).filter(Boolean);
}

/* ---------- Validation / persistence ---------- */
function normaliseQuiz(q){
  if (!q || !Array.isArray(q.rounds)) throw new Error('no rounds were found in the data');
  return {
    title: String(q.title || 'Imported Quiz').slice(0, 80),
    rounds: q.rounds.filter(r => r && typeof r === 'object').map((r, i) => ({
      id: typeof r.id === 'string' && r.id ? r.id : uid(),
      name: String(r.name || `Round ${i + 1}`).slice(0, 60),
      info: String(r.info || '').slice(0, 400),
      type: r.type === 'letters' ? 'letters' : 'standard',
      mystery: String(r.mystery || '').slice(0, 60),
      clue: String(r.clue || '').slice(0, 400),
      mode: ['choice', 'typed', 'written', 'buzz'].includes(r.mode) ? r.mode : 'buzz',
      questions: (Array.isArray(r.questions) ? r.questions : [])
        .filter(x => x && (x.q || x.question))
        .map(x => ({
          id: typeof x.id === 'string' && x.id ? x.id : uid(),
          q: String(x.q ?? x.question).slice(0, 600),
          a: String(x.a ?? x.answer ?? '').slice(0, 300),
          pts: clampPts(x.pts ?? x.points ?? 1),
          cat: String(x.cat ?? x.category ?? r.name ?? '').slice(0, 60),
          note: String(x.note ?? '').slice(0, 400),
          wrong: (Array.isArray(x.wrong) ? x.wrong : []).map(w => String(w).slice(0, 200)).filter(Boolean).slice(0, 3)
        }))
    })),
    libId: typeof q.libId === 'string' ? q.libId.slice(0, 60) : '',
    tiebreakers: (Array.isArray(q.tiebreakers) ? q.tiebreakers : []).filter(t => t && (t.q || t.question)).slice(0, 10).map(t => ({
      id: typeof t.id === 'string' && t.id ? t.id : uid(),
      q: String(t.q ?? t.question).slice(0, 600), a: String(t.a ?? t.answer ?? '').slice(0, 200), note: String(t.note || '').slice(0, 400)
    }))
  };
}
function normTeams(arr){
  return arr.filter(t => t && typeof t === 'object').slice(0, MAX_TEAMS).map((t, i) => ({
    id: typeof t.id === 'string' && t.id ? t.id : uid(),
    name: String(t.name || `Team ${i + 1}`).slice(0, 40),

    colour: isHex(t.colour) ? t.colour.toLowerCase() : TEAM_COLOURS[i % TEAM_COLOURS.length],
    avatar: avatarId(t.avatar, i)

}

/* ---------- Quiz position helpers ---------- */
function rounds(st = S){ return st.quiz.rounds; }
const curRound = () => rounds()[S.pos.r] || null;
const curQ = () => { const r = curRound(); return r ? r.questions[S.pos.q] || null : null; };
function totalQs(st = S){ return rounds(st).reduce((n, r) => n + r.questions.length, 0); }
const team = id => S.teams.find(t => t.id === id) || null;
const teamName = id => { const t = team(id); return t ? t.name : 'Removed'; };
function nextNonEmpty(from, st = S){ const R = rounds(st); for (let i = Math.max(0, from); i < R.length; i++) if (R[i].questions.length) return i; return -1; }
function prevNonEmpty(from, st = S){ const R = rounds(st); for (let i = Math.min(from, R.length - 1); i >= 0; i--) if (R[i].questions.length) return i; return -1; }
function clampPos(st = S){
  const R = rounds(st);
  if (!R.length || !totalQs(st)){ st.pos = { r: 0, q: 0 }; st.between = false; st.finished = false; return; }
  let r = clamp(st.pos.r | 0, 0, R.length - 1);
  if (!R[r].questions.length){ const n = nextNonEmpty(r, st); r = n >= 0 ? n : prevNonEmpty(r, st); }
  st.pos.r = r;
  st.pos.q = clamp(st.pos.q | 0, 0, R[r].questions.length - 1);
  if (st.between && nextNonEmpty(r + 1, st) < 0 && R[r].mode !== 'written') st.between = false;
}
function keepCurrent(fn){
  const id = curQ() && curQ().id;

    const R = rounds();
    for (let r = 0; r < R.length; r++){

      if (q >= 0){ S.pos = { r, q }; clampPos(); return; }

}
const isLastInRound = () => { const r = curRound(); return !!r && S.pos.q >= r.questions.length - 1; };
const isLastRound = () => nextNonEmpty(S.pos.r + 1) < 0;

/* ---------- Timer ---------- */
function timerRem(){ return S.timer.running ? Math.max(0, (S.timer.end - Date.now()) / 1000) : S.timer.rem; }
function timerReset(){ S.timer = { running: false, end: 0, rem: S.settings.timer }; }
function timerStart(){
  if (S.settings.timer <= 0) return;
  let rem = S.timer.rem;
  if (!(rem > 0)) rem = S.settings.timer;
  S.timer = { running: true, end: Date.now() + rem * 1000, rem };
  lastBeep = -1;
}
function timerPause(){ if (!S.timer.running) return; S.timer = { running: false, end: 0, rem: timerRem() }; }
function fmt(sec){ const s = Math.ceil(sec); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function paintTimer(){

  document.querySelectorAll('[data-timer]').forEach(el => el.classList.toggle('timer-low', rem <= 5));
  document.querySelectorAll('[data-timer-num]').forEach(el => { el.textContent = fmt(rem); });
  document.querySelectorAll('[data-timer-bar]').forEach(el => { el.style.width = pct + '%'; });
  document.querySelectorAll('[data-timer-btn]').forEach(el => { el.textContent = S.timer.running ? 'Pause timer' : (rem < tot && rem > 0 ? 'Resume timer' : 'Start timer'); });
}
let lastBeep = -1;
setInterval(() => {
  if (!S.timer.running) return;

    S.timer = { running: false, end: 0, rem: 0 };

/* ---------- Sound ---------- */
let AC = null;
function unlockAudio(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
}
function beep(freq, dur){
  if (!S.settings.sound) return;
  try {
    unlockAudio(); if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable */ }
}
const SOUND_FILES = {

/* ---------- Scoring ---------- */
function addScore(id, d, label, g){
  const t = team(id); if (!t || !d) return;
  t.score += d;
  S.history.push({ id, d, label, g });
  if (S.history.length > 200) S.history.splice(0, S.history.length - 200);
}
/* One rules module handles Classic, Show and untouched legacy scoring. */
function speedAwards(){
  const q = curQ(), base = q ? q.pts : 1;
  const lq = isAnswerRound() ? listAnswers(q) : null;
  const right = S.buzz.order.filter(b => b.st === 'right').sort((a, b) => a.t - b.t);
  const map = new Map();
  if (lq){
    const cap = Math.max(base || 1, lq.length);
    right.forEach(b => map.set(b.id, Math.min(cap, Math.max(1, b.hits || 0))));
    return map;
  }
  const scoring = isClassic()
    ? PQPRules.calculateClassicAwards(base, S.buzz.order)
    : isShow()
      ? PQPRules.calculateShowAwards(base, S.buzz.order, isAnswerRound() ? 'simultaneous' : 'exclusive')
      : PQPRules.calculateLegacyAwards(S.settings.scoring, base, S.buzz.order, isAnswerRound());
  return new Map(scoring);
}
function awardSpeed(silent){
  if (S.buzz.awarded) return false;

    if (!silent) toast('This question has already been scored. Scores were not awarded again.');
    return false;
  }
  if (!isLegacy() && !S.revealed){ if (!silent) toast('Reveal the answer before awarding points.'); return false; }
  if (!isLegacy() && S.buzz.order.some(b => b.st === 'wait')){
    if (!silent) toast('Mark every answer before awarding points.'); return false;
  }
  const m = speedAwards();
  const gains = Array.from(m).filter(([, p]) => p > 0);
  if (!gains.length){ if (!silent) toast('Mark at least one answer correct first.'); return false; }
  const g = uid();
  gains.forEach(([id, p]) => addScore(id, p, isClassic() ? 'Classic correct answer' : isShow() ? 'Game show correct answer' : !isSpeed() ? 'Correct answer' : p === 2 ? 'Fastest correct' : 'Second fastest correct', g));
  S.buzz.awarded = true; S.buzz.g = g; S.buzz.open = false;
  if (!isLegacy() && curQ()) S.questionAwards[curQ().id] = { g };
  timerPause();
  playCue('gain',.45);
  if (!silent) toast(gains.map(([id, p]) => `${teamName(id)} +${p}`).join(', '));
  return true;
}
function markBuzz(id, st){
  if (isShowExclusive()){ toast('Use the Correct / Wrong buttons for the active team.'); return; }
  if (!isLegacy() && !S.revealed){ toast('Lock and reveal the question before changing marks.'); return; }
  if (S.buzz.awarded || (!isLegacy() && curQ() && S.questionAwards[curQ().id])){ toast('Points are already awarded. Press Undo to change them.'); return; }
  const b = S.buzz.order.find(x => x.id === id); if (!b) return;
  b.st = b.st === st ? 'wait' : st;

}
function judge(ok){
  const b = S.buzz.order.find(x => x.st === 'wait');

    if (S.buzz.awarded || (!isLegacy() && curQ() && S.questionAwards[curQ().id])){ toast('Points are already awarded. Press Undo to change them.'); return; }

  }

       All deductions and the eventual positive award share a question group. */
    if (S.buzz.awarded || S.revealed || b !== showActive()) return;
    b.st = ok ? 'right' : 'wrong';
    const group = S.buzz.g || uid();

    setAvatarReaction(b.id, b.st);
    if (ok){
      addScore(b.id, pts, 'Game Show winning buzzer', group);
      S.questionAwards[q.id] = { g: group };

    }

  }
  if (ok){
    if (!isLegacy() && curQ() && S.questionAwards[curQ().id]){ toast('This question is already scored.'); return; }
    b.st = 'right';
    const g = uid();
    addScore(b.id, pts, 'Correct buzz', g);
    S.buzz.g = g;
    if (!isLegacy() && curQ()) S.questionAwards[curQ().id] = { g };

}
/* Explicit question recovery. A score group may no longer be the latest

function reopenCurrentAward(){
  if (isLegacy() || !inPlay() || !curQ()) return;
  const qid = curQ().id, record = S.questionAwards[qid];
  if (!record) return;
  ask(isShowExclusive() ? 'Re-run this buzzer question?' : 'Reopen this question?', isShowExclusive() ? 'This reverses the scores and penalties from this question only, then clears all buzzer attempts so teams can play the question again.' : 'This reverses ONLY the points awarded for this question. Other questions and manual score adjustments stay unchanged. You can then correct the marks and award again.', isShowExclusive() ? 'Re-run question' : 'Reopen marking', () => {
    const group = record.g;
    if (group){
      S.history = S.history.filter(h => {
        if (h.g !== group) return true;
        const t = team(h.id); if (t) t.score -= h.d;
        return false;

    }
    delete S.questionAwards[qid];
    S.buzz.awarded = false; S.buzz.g = null; S.buzz.open = false;
    if (isShowExclusive()){

      S.buzz.order = []; S.buzz.n = uid(); S.buzz.open = S.settings.autoOpen;
      S.revealed = false; timerReset();
      if (S.buzz.open && S.settings.autoTimer) timerStart();
    } else { S.revealed = true; timerPause(); }
    commit(); toast(isShowExclusive() ? 'Buzzer round restarted; earlier awards and penalties reversed.' : 'Marks reopened. Correct them, then finalise again.');
  });
}
function finaliseZero(silent){
  if (isLegacy() || !inPlay() || !curQ()) return false;

  if (!S.revealed){ if (!silent) toast('Reveal the answer before finalising.'); return false; }
  if (S.buzz.order.some(b => b.st === 'wait')){ if (!silent) toast('Mark every submitted answer before finalising.'); return false; }
  if (Array.from(speedAwards().values()).some(p => p > 0)){
    if (!silent) toast('Correct answers are marked. Use Award points, or change the marks.');
    return false;
  }
  S.questionAwards[curQ().id] = { g: isShowExclusive() ? S.buzz.g : null, zero: true };
  S.buzz.awarded = true; S.buzz.g = null; S.buzz.open = false;
  timerPause();
  if (!silent) toast('Question finalised: no correct answer points awarded.');
  return true;
}
function skipCurrent(){
  if (isLegacy() || !inPlay() || !curQ()) return;
  if (S.questionAwards[curQ().id]) { goNext(); return; }
  ask('Skip this question?', 'This records zero points for every team and moves on. Any submitted answers will not score. You can return later and reopen marking if needed.', 'Skip for zero points', () => {
    if (isShowExclusive() && S.buzz.g){
      removeGroup(S.buzz.g);
      S.buzz.g = null;
    }
    S.revealed = true; S.buzz.open = false;
